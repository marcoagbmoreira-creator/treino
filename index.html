    if(!age||!hcm||!w){toast('Preencha idade, altura e peso');return}
    let bmr;
    if(bf!=null&&bf>0&&bf<60){
      bmr=370+21.6*(w*(1-bf/100)); /* Katch-McArdle: massa magra */
    }else{
      bmr=sex==='f'?10*w+6.25*hcm-5*age-161:10*w+6.25*hcm-5*age+5; /* Mifflin-St Jeor */
    }
    const tdee=Math.round(bmr*act);
    diet.settings.profile={age,h:hcm,w,bf:bf!=null?bf:null,sex,act};
    const had=!!(diet.settings.lastCoach&&diet.settings.lastCoach.goal), restarted=applyTdee0(tdee);
    await saveDiet();await touchAndPush();
    toast('✓ TDEE inicial: '+fmt(tdee)+' kcal/dia'+(had&&!restarted?' — metas mantidas':''));
    renderDiet();
  };
  view.querySelectorAll('.dhist .del').forEach(b=>b.onclick=async()=>{
    if(confirm('Apagar o registro de '+b.dataset.dd+'?')){delete diet.entries[b.dataset.dd];await saveDiet();await touchAndPush();renderDiet()}
  });
  document.getElementById('dexp').onclick=()=>{
    let rows=['sep=;','Data;Peso (kg);Tendência (kg);Kcal;Proteína (g);Incompleto'];
    const tr=computeTrend();
    for(const d of dietDates()){
      const e=diet.entries[d];
      rows.push([d.split('-').reverse().join('/'),e.weight!=null?String(e.weight).replace('.',','):'',tr[d]!=null?tr[d].toFixed(2).replace('.',','):'',e.kcal??'',e.prot??'',e.inc?'sim':''].join(';'));
    }
    download('dieta.csv','\uFEFF'+rows.join('\r\n'),'text/csv;charset=utf-8');
    toast('✓ CSV exportado');
  };
}
function drawDietChart(){
  const cv=document.getElementById('dchart');if(!cv)return;
  const dpr=window.devicePixelRatio||1, W=cv.clientWidth, H=220;
  cv.width=W*dpr;cv.height=H*dpr;
  const ctx=cv.getContext('2d');ctx.scale(dpr,dpr);
  const trend=computeTrend();
  const all=dietDates().filter(d=>diet.entries[d].weight!=null&&diet.entries[d].weight!=='');
  ctx.font='600 10.5px -apple-system,BlinkMacSystemFont,sans-serif';
  const cFaint=cssv('--faint'), cGrid=cssv('--chart-grid'), cDot=cssv('--chart-dot'), cAcc=cssv('--accent');
  if(all.length<2){ctx.fillStyle=cFaint;ctx.font='14px -apple-system,sans-serif';ctx.fillText('Registre pesagens para ver o gráfico',4,105);return}
  const endT=new Date(all[all.length-1]).getTime();
  const fromT=dietRange===0?new Date(all[0]).getTime():endT-dietRange*86400000;
  const ds=all.filter(d=>new Date(d).getTime()>=fromT);
  if(ds.length<2){ctx.fillStyle=cFaint;ctx.font='14px -apple-system,sans-serif';ctx.fillText('Poucos dados no período',4,105);return}
  let mn=Infinity,mx=-Infinity;
  ds.forEach(d=>{mn=Math.min(mn,+diet.entries[d].weight,trend[d]);mx=Math.max(mx,+diet.entries[d].weight,trend[d])});
  const pad=(mx-mn)*0.15||0.5;mn-=pad;mx+=pad;
  const X=d=>38+((new Date(d).getTime()-fromT)/(endT-fromT||1))*(W-50);
  const Y=v=>H-22-((v-mn)/(mx-mn))*(H-40);
  ctx.strokeStyle=cGrid;ctx.fillStyle=cFaint;ctx.lineWidth=1;
  for(let i=0;i<=3;i++){
    const v=mn+(mx-mn)*i/3, y=Y(v);
    ctx.beginPath();ctx.moveTo(36,y);ctx.lineTo(W-8,y);ctx.stroke();
    ctx.fillText(v.toFixed(1),2,y+4);
  }
  ctx.fillStyle=cDot;
  ds.forEach(d=>{ctx.beginPath();ctx.arc(X(d),Y(+diet.entries[d].weight),2.6,0,7);ctx.fill()});
  ctx.strokeStyle=cAcc;ctx.lineWidth=2.5;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();
  ds.forEach((d,i)=>{const x=X(d),y=Y(trend[d]);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});
  ctx.stroke();
}

/* ============ Hevy: o programa vem das rotinas, o site faz a progressão ============
   - Rotinas do Hevy definem treinos, exercícios, séries e faixas de reps (atualizados a cada sync).
   - RIR alvo e incremento de carga são do site e ficam preservados por exercício.
   - Sessões casam pelo ID do template do Hevy: primeiro dentro do treino da sessão, depois no programa todo.
   - Exercícios fora das rotinas ficam no histórico, mas não alimentam a progressão. */
const normName=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
let hevyState='';
async function hevyGet(path,page){
  const r=await fetch('https://api.hevyapp.com/v1/'+path+'?page='+page+'&pageSize=10',{headers:{'api-key':hevyKey}});
  if(r.status===404&&page>1)return null; /* passou da última página */
  if(!r.ok)throw new Error('HTTP '+r.status);
  return r.json();
}
async function hevyRoutines(){
  const out=[];
  for(let p=1;p<=10;p++){
    const d=await hevyGet('routines',p);if(!d)break;
    const l=d.routines||[];out.push(...l);
    if(l.length<10||(d.page_count!=null&&p>=d.page_count))break;
  }
  return out;
}
function hevyRepRange(he){
  const work=(he.sets||[]).filter(s=>s.type!=='warmup');
  let rmin=null,rmax=null;
  for(const s of work){
    const lo=s.rep_range&&s.rep_range.start!=null?+s.rep_range.start:(s.reps!=null?+s.reps:null);
    const hi=s.rep_range&&s.rep_range.end!=null?+s.rep_range.end:(s.reps!=null?+s.reps:null);
    if(lo!=null)rmin=rmin==null?lo:Math.min(rmin,lo);
    if(hi!=null)rmax=rmax==null?hi:Math.max(rmax,hi);
  }
  return{nSets:Math.max(1,work.length),rmin,rmax};
}
function applyRoutines(routines){
  let created=0,newEx=0;
  const claimed=new Set(), seenRid=new Set();
  for(const rt of routines){
    seenRid.add(rt.id);
    let wo=program.find(w=>w.hevyRid===rt.id)||program.find(w=>!w.hevyRid&&normName(w.name)===normName(rt.title));
    if(!wo){wo={id:uid(),name:rt.title||'Treino',hevyRid:rt.id,exercises:[]};program.push(wo);created++}
    else{wo.hevyRid=rt.id;wo.name=rt.title||wo.name}
    const newList=[];
    for(const he of (rt.exercises||[])){
      const tid=he.exercise_template_id||null;
      const{nSets,rmin,rmax}=hevyRepRange(he);
      /* cada vaga de rotina tem seu próprio exercício: o mesmo template em dois treinos gera dois exercícios, com progressões separadas */
      let ex=null;
      if(tid){
        ex=wo.exercises.find(x=>x.hevyId===tid&&!claimed.has(x));
        if(!ex)for(const w2 of program){ex=w2.exercises.find(x=>x.hevyId===tid&&!claimed.has(x));if(ex)break}
      }
      if(ex){ /* já existe: preserva id (histórico), RIR e incremento */
        ex.name=he.title||ex.name;
        ex.sets=nSets;
        if(rmin!=null)ex.repMin=rmin;
        if(rmax!=null)ex.repMax=Math.max(rmax,ex.repMin);
        if(he.rest_seconds)ex.rest=+he.rest_seconds;
      }else{
        const rMin=rmin!=null?rmin:8, rMax=rmax!=null?Math.max(rmax,rMin):12;
        ex={id:uid(),name:he.title||'Exercício',sets:nSets,repMin:rMin,repMax:rMax,rirMin:1,rirMax:2,inc:rMin<=8?2.5:1.25,rest:he.rest_seconds?+he.rest_seconds:120,hevyId:tid};
        newEx++;
      }
      claimed.add(ex);newList.push(ex);
    }
    wo.exercises=newList;
  }
  /* o programa passa a ser só o que existe no Hevy — o histórico dos treinos removidos é preservado */
  const before=program.length;
  program=program.filter(w=>w.hevyRid&&seenRid.has(w.hevyRid)&&w.exercises.length);
  if(!program.find(w=>w.id===selWorkout))selWorkout=program[0]?.id;
  return{created,newEx,removed:before-program.length};
}
function hevyWorkoutFor(id,title){
  return (id&&program.find(x=>x.hevyRid===id))||program.find(x=>normName(x.name)===normName(title))||null;
}
function hevyMatchEx(tid,wo){
  if(!tid)return null;
  if(wo){const f=wo.exercises.find(x=>x.hevyId===tid);if(f)return f}
  for(const w of program){const f=w.exercises.find(x=>x.hevyId===tid);if(f)return f}
  return null;
}
function hevySession(w,prev){
  const wo=hevyWorkoutFor(w.routine_id,w.title), entries=[];
  for(const he of (w.exercises||[])){
    const sets=(he.sets||[]).filter(s=>s.type!=='warmup').map(s=>({
      w:s.weight_kg!=null?+s.weight_kg:null,
      r:s.reps!=null?+s.reps:null,
      rir:s.rpe!=null?Math.max(0,Math.round(10-s.rpe)):null
    }));
    if(!sets.some(s=>s.r!=null))continue;
    const tid=he.exercise_template_id||null, m=hevyMatchEx(tid,wo);
    entries.push({exId:m?m.id:'hevy_'+(tid||normName(he.title)),exName:m?m.name:(he.title||'Exercício'),tid,sets});
  }
  if(!entries.length)return null;
  return{id:prev?prev.id:uid(),hevyId:w.id,routineId:w.routine_id||null,date:w.start_time||w.created_at||new Date().toISOString(),workoutId:wo?wo.id:'hevy',workoutName:w.title||'Treino Hevy',entries};
}
function relinkHevy(){ /* reaponta o histórico importado para o programa atual, sem chamar a API */
  for(const s of history){
    if(!s.hevyId)continue;
    const wo=program.find(w=>w.id===s.workoutId)||hevyWorkoutFor(s.routineId,s.workoutName);
    if(wo)s.workoutId=wo.id;
    for(const e of s.entries){
      const tid=e.tid||(String(e.exId).startsWith('hevy_')?String(e.exId).slice(5):null);
      const m=hevyMatchEx(tid,wo);
      if(m){e.exId=m.id;e.exName=m.name;e.tid=tid}
    }
  }
}
/* sync completo: rotinas → treinos → revínculo. Grava uma vez só, e só se algo mudou.
   auto (abertura do app): envia à nuvem apenas se o download da nuvem deu certo nesta sessão.
   full: revisita todo o histórico do Hevy e atualiza as sessões no lugar (nunca apaga). */
async function hevyFullSync(auto,full){
  if(!hevyKey)return{n:0,upd:0};
  const before=JSON.stringify([program,history]);
  const out={n:0,upd:0,rt:null,err:''};
  try{
    const routines=await hevyRoutines();
    if(routines.length)out.rt=applyRoutines(routines); /* sem rotinas (ou falha): mantém o programa atual */
  }catch(e){out.err='rotinas: '+(e&&e.message||'rede/CORS')}
  const byId=new Map(history.filter(h=>h.hevyId).map(h=>[h.hevyId,h]));
  try{
    for(let p=1;p<=(full?60:10);p++){
      const d=await hevyGet('workouts',p);if(!d)break;
      const list=d.workouts||[];
      let fresh=0;
      for(const w of list){
        if(!w.id)continue;
        const prev=byId.get(w.id);
        if(prev&&!full)continue;
        const s=hevySession(w,prev);
        if(!s)continue;
        if(prev){Object.assign(prev,s);out.upd++}
        else{history.push(s);byId.set(w.id,s);out.n++;fresh++}
      }
      if(list.length<10||(d.page_count!=null&&p>=d.page_count))break;
      if(!full&&!fresh)break; /* sync rápido: parou de achar novidade */
    }
  }catch(e){out.err=(out.err?out.err+' · ':'')+'treinos: '+(e&&e.message||'rede/CORS')}
  relinkHevy();
  history.sort((a,b)=>new Date(a.date)-new Date(b.date));
  out.changed=JSON.stringify([program,history])!==before;
  if(out.changed){
    await saveProgram();await saveHistory();
    if(!auto||pullOk)await touchAndPush();
  }
  if(!out.err){hevyLast=new Date().toISOString();await sSet(K_HSYNC,hevyLast)}
  hevyState=out.err?'⚠️ Falha parcial — '+out.err:'';
  return out;
}
function hevyMsg(r){
  if(r.err&&!r.changed)return '⚠️ Hevy: '+r.err;
  const p=[];
  if(r.n)p.push(r.n+' treino(s) novo(s)');
  if(r.rt&&r.rt.newEx)p.push(r.rt.newEx+' exercício(s) novo(s) no programa');
  if(r.rt&&r.rt.removed)p.push(r.rt.removed+' treino(s) fora do Hevy removido(s) do programa');
  return (r.err?'⚠️ ':'✓ ')+(p.length?p.join(' · '):(r.changed?'Programa e histórico atualizados':'Tudo em dia com o Hevy'));
}

/* ============ util ============ */
const numBR=v=>{if(v==null||v==='')return null;const n=parseFloat(String(v).replace(',','.'));return isNaN(n)?null:n};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._to);t._to=setTimeout(()=>t.classList.remove('show'),2600)}
/* ============ PIN lock ============ */
const PIN_H=2085891405; /* hash do PIN — o código não guarda o PIN em texto */
function djb2(s){let h=5381;for(let i=0;i<s.length;i++)h=((h*33)^s.charCodeAt(i))>>>0;return h}
let pinBuf='';
function pinInit(){
  let ok=false;try{ok=sessionStorage.getItem('ul_unlocked')==='1'}catch(e){}
  const L=document.getElementById('lock');
  if(ok){L.remove();boot();return}
  L.querySelectorAll('.pinpad button').forEach(b=>b.onclick=()=>{
    const k=b.dataset.k;if(k==null)return;
    if(k==='del')pinBuf=pinBuf.slice(0,-1);
    else if(pinBuf.length<4)pinBuf+=k;
    L.querySelectorAll('.pindots span').forEach((s,i)=>s.classList.toggle('f',i<pinBuf.length));
    if(pinBuf.length===4){
      if(djb2(pinBuf)===PIN_H){
        try{sessionStorage.setItem('ul_unlocked','1')}catch(e){}
        L.remove();boot();
      }else{
        L.classList.add('err');
        setTimeout(()=>{L.classList.remove('err');pinBuf='';L.querySelectorAll('.pindots span').forEach(s=>s.classList.remove('f'))},350);
      }
    }
  });
}
function goTab(t){if(tab==='program')harvest();tab=t;render();window.scrollTo(0,0)}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>goTab(b.dataset.tab));
document.getElementById('gear').onclick=()=>goTab('data');

try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(!document.getElementById('lock'))render()})}catch(e){}
