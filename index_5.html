const rateKg=()=>ratePct()/100*curWeight();              /* kg/sem */
const rateKcal=()=>rateKg()*KCAL_PER_KG/7;              /* kcal/dia de déficit ou superávit */
/* Gasto (TDEE) por balanço energético — kcal registradas − variação do peso × 7.700 —, combinado com a
   estimativa anterior pela precisão de cada um (média ponderada pelo inverso da variância):
   · a inclinação vem de regressão ponderada nas pesagens do dia (a média móvel atrasa no começo e enviesava o gasto);
   · a confiança cresce com a quantidade e a estabilidade dos dados, não com um prazo fixo;
   · numa fase nova (troca de objetivo ou de meta), os dados anteriores saem da janela, os primeiros dias valem pouco
     e a fase começa ancorada no gasto da fase anterior.
   O número fica na régua do seu registro: se você registra sempre menos do que come, ele sai menor que o gasto
   real; com registro e padrão estáveis, o acompanhamento do peso compensa parte desse erro no ritmo. */
function computeTDEE(){
  const s=diet.settings, ph=s.phase||null;
  const prior=ph&&ph.prior?+ph.prior:+s.tdee0, priorSD=ph&&ph.priorSD?+ph.priorSD:PRIOR_SD0;
  const base={tdee:Math.round(prior),observed:null,conf:0,sd:Math.round(priorSD),avgK:null,days:0,span:0,nK:0,cover:null,
    prior:Math.round(prior),stale:false,ageDays:null,endISO:null,why:null};
  const all=dietDates(), has=(d,f)=>diet.entries[d][f]!=null&&diet.entries[d][f]!=='';
  const wd=all.filter(d=>has(d,'weight')), kdAll=all.filter(d=>has(d,'kcal')&&!diet.entries[d].inc);
  if(!wd.length)return base;
  /* a janela de balanço termina no último dia que tem os dois registros (peso e kcal) */
  const lastW=dayNum(wd[wd.length-1]), lastK=kdAll.length?dayNum(kdAll[kdAll.length-1]):null;
  const endN=lastK!=null?Math.min(lastW,lastK):lastW;
  base.ageDays=dayNum(todayISO())-endN;base.stale=base.ageDays>STALE_DAYS;
  base.endISO=new Date(endN*864e5).toISOString().slice(0,10);
  if(lastK==null||lastW-lastK>=TDEE_WINDOW){base.why='kcal';return base}
  const phN=ph&&ph.start?dayNum(ph.start):null;
  let startN=Math.max(endN-(TDEE_WINDOW-1),phN??-Infinity);
  /* depois de uma pausa longa nas pesagens, só vale o que veio depois dela */
  const wN=wd.map(dayNum).filter(n=>n<=endN);
  for(let i=1;i<wN.length;i++)if(wN[i]-wN[i-1]>=GAP_DAYS&&wN[i]>startN)startN=wN[i];
  /* ingestão e peso no mesmo período: a janela começa no primeiro dia com kcal */
  const firstK=kdAll.map(dayNum).find(n=>n>=startN&&n<=endN);
  if(firstK!=null&&firstK>startN)startN=firstK;
  const wOf=n=>{
    if(phN==null)return 1;
    const k=n-phN;
    if(k<0)return 0;
    if(k>=SETTLE_DAYS)return 1;
    return k<4?0.1:0.1+0.9*(k-3)/(SETTLE_DAYS-3);
  };
  const inWin=d=>{const n=dayNum(d);return n>=startN&&n<=endN};
  const pts=wd.filter(inWin).map(d=>({x:dayNum(d)-endN,y:+diet.entries[d].weight,w:wOf(dayNum(d))})).filter(p=>p.w>0);
  const kd=kdAll.filter(inWin);
  let dayW=0;for(let n=startN;n<=endN;n++)dayW+=wOf(n);
  const kw=kd.map(d=>({k:+diet.entries[d].kcal,w:wOf(dayNum(d))}));
  const KW=kw.reduce((a,o)=>a+o.w,0);
  const cover=dayW>0?Math.min(1,KW/dayW):0;
  Object.assign(base,{nK:kd.length,cover,span:endN-startN+1});
  const W=pts.reduce((a,p)=>a+p.w,0);
  if(pts.length<4||W<2){base.why='peso';return base}
  if(kd.length<MIN_KDAYS||cover<MIN_COVER){base.why='kcal';return base}
  const mx=pts.reduce((a,p)=>a+p.w*p.x,0)/W, my=pts.reduce((a,p)=>a+p.w*p.y,0)/W;
  let sxx=0,sxy=0;
  for(const p of pts){sxx+=p.w*(p.x-mx)**2;sxy+=p.w*(p.x-mx)*(p.y-my)}
  if(sxx/W<3){base.why='peso';return base} /* dados espalhados por menos de ~6 dias */
  const slope=sxy/sxx;
  let sse=0;
  for(const p of pts)sse+=p.w*(p.y-my-slope*(p.x-mx))**2;
  const sig2=Math.max(sse/Math.max(1,W-2),0.15**2);
  const seSlope=NOISE_AC*Math.sqrt(sig2/sxx);
  const avgK=kw.reduce((a,o)=>a+o.w*o.k,0)/KW;
  const varK=kw.reduce((a,o)=>a+o.w*(o.k-avgK)**2,0)/KW;
  const nK=KW*KW/kw.reduce((a,o)=>a+o.w*o.w,0);
  const sdDay=Math.max(Math.sqrt(varK),DAY_SD_MIN);
  const observed=avgK-slope*KCAL_PER_KG;
  /* incerteza do gasto medido: inclinação do peso + média de ingestão (com piso de variação diária) + dias sem
     registro (podem ter sido diferentes dos registrados). O "peso dos dados" sai da comparação com a anterior */
  const varObs=(seSlope*KCAL_PER_KG)**2+sdDay*sdDay/Math.max(1,nK)+((1-cover)*MISSING_GAP)**2;
  const age=Math.max(0,endN-(phN??dayNum(wd[0])));
  const varPrior=priorSD*priorSD+DRIFT*DRIFT*age;
  const conf=varPrior/(varPrior+varObs);
  /* dias sem kcal concentrados no fim de semana: se você come diferente nesses dias, o gasto medido fica na régua
     dos dias úteis — a meta ainda se corrige pelo peso, mas só enquanto esse padrão não mudar */
  const kSet=new Set(kd.map(dayNum)), wkend=n=>{const g=new Date(n*864e5).getUTCDay();return g===0||g===6};
  let missE=0,missW=0,nE=0,nW=0;
  for(let n=startN;n<=endN;n++){const e=wkend(n);if(e)nE++;else nW++;if(!kSet.has(n)){if(e)missE++;else missW++}}
  const weekendGap=nE>=4&&missE/nE>=0.5&&(nW?missW/nW:0)<=0.2;
  /* a incerteza do gasto cresce com o tempo desde o último dado (o gasto real muda) */
  const sdNow=Math.sqrt(varPrior*varObs/(varPrior+varObs)+DRIFT*DRIFT*Math.max(0,base.ageDays));
  return Object.assign(base,{tdee:Math.round(conf*observed+(1-conf)*prior),observed:Math.round(observed),conf,
    sd:Math.round(sdNow),avgK:Math.round(avgK),days:Math.round(-pts[0].x),weekendGap});
}
function weeklyRate(){
  const trend=computeTrend();

  const endT=new Date(wd[wd.length-1]).getTime();
  const win=wd.filter(d=>(endT-new Date(d).getTime())/86400000<=14);
  if(win.length<3)return null;

function maintText(){

    const n=dayNum(d), e=diet.entries[d];

/* fixa as metas da semana: kcal + macros calculados agora (peso-tendência de hoje) e guardados até o próximo check-in */
function makeWeek(goal,t,status,kind,next){
  const s=diet.settings, today=todayISO(), M=computeMacros({goal});
  s.week={start:today,next,kcal:goal,prot:M.prot,carb:M.carbs,fat:M.fatG,sum:M.sum,warn:M.warn||'',
    tdee:t.tdee,sd:t.sd,conf:Math.round(t.conf*100),measured:t.observed!=null,weight:Math.round(curWeight()*10)/10,
    mode:s.mode,ratePct:(s.mode==='deficit'||s.mode==='surplus')?ratePct():null,status,kind};
  if(kind==='checkin'){
    const h=(s.checkins||[]).filter(c=>c.date!==today);
    h.push({date:today,kcal:goal,prot:M.prot,carb:M.carbs,fat:M.fatG,tdee:t.tdee,measured:t.observed!=null,weight:s.week.weight,mode:s.mode,status});

/* meta da semana. O 1º check-in (início ou troca de objetivo) parte do plano atual; nos seguintes, a meta só se move
   com gasto medido, dados recentes e semana com dados suficientes; sem isso, fica onde estava ("mantida") */
function targetKcal(){
  const s=diet.settings, t=computeTDEE();
  const base=t.tdee, observed=t.observed!=null, today=todayISO();
  if(s.checkinDay==null)s.checkinDay=checkinDow(); /* fixa o dia (antes: 7 dias depois do último ajuste) */
  if(s.mode==='maint'&&s.maintTarget==null&&Object.keys(computeTrend()).length)s.maintTarget=Math.round(curWeight()*10)/10;
  if(s.mode==='fixed'){
    const goal=planGoal(), due=!s.week||s.week.mode!=='fixed'||today>=s.week.next;
    if(due||s.week.dirty||s.week.kcal!==goal){makeWeek(goal,t,'prescrição da nutricionista',due?'checkin':'ajuste',due||!realISO(s.week.next)?nextCheckin(today):s.week.next);saveDiet()}
    return{goal,base,observed,next:daysTo(s.week.next),nextISO:s.week.next,changed:false,fixed:true,checkedIn:due};
  }
  const raw=planGoal(), lo=goalMin(), clamp=g=>Math.min(GOAL_MAX,Math.max(lo,g));
  const lc=s.lastCoach&&isFinite(+s.lastCoach.goal)&&+s.lastCoach.goal>=800&&okISO(s.lastCoach.date)?s.lastCoach:null;
  if(!lc){
    const goal=clamp(raw);
    s.lastCoach={date:today,goal};
    makeWeek(goal,t,observed&&!t.stale?'meta do objetivo, com o gasto medido':'meta do objetivo, com o gasto estimado','checkin',nextCheckin(today));saveDiet();
    return{goal,base,observed,raw,next:daysTo(s.week.next),nextISO:s.week.next,changed:false,checkedIn:true,paused:t.stale,recal:!observed,fromStale:t.stale&&observed,floor:goal!==raw};
  }
  const cur=clamp(+lc.goal), nx=nextCheckin(lc.date);
  if(today<nx){
    /* no meio da semana: metas fixas; só se refazem se a configuração mudou (objetivo, ritmo, proteína…) */
    if(!s.week||s.week.dirty||s.week.mode!==s.mode||s.week.kcal!==cur){makeWeek(cur,t,s.week?(s.week.dirty==='backup'?'recalculada a partir do backup restaurado':'ajustada no meio da semana (mudança de configuração)'):'metas da semana','ajuste',nx);saveDiet()}
    return{goal:cur,base,observed,raw,next:daysTo(nx),nextISO:nx,changed:false,paused:t.stale,recal:!observed,floor:cur!==+lc.goal};
  }
  /* check-in */
  const wk=weekDataOk();
  let goal=cur,status,want=cur;
  if(t.stale)status='mantida — sem dados recentes';
  else if(!observed)status='mantida — o gasto ainda não pode ser medido';
  else if(!wk.ok)status=`mantida — a semana teve ${wk.k} dia(s) com kcal e ${wk.w} pesagem(ns); são precisos 4 e 1`;
  else{want=cur+Math.max(-200,Math.min(200,raw-cur));goal=clamp(want);status=goal===cur?'mantida — gasto estável':'atualizada pelo gasto medido'}
  if(s.mode==='maint'){const m=maintInfo();if(m.tgt!=null)status+=m.inBand?' · peso dentro da faixa do alvo':` · peso ${m.diff>0?'acima':'abaixo'} da faixa do alvo: leve ${m.diff>0?'déficit':'superávit'}`}
  s.lastCoach={date:today,goal};
  makeWeek(goal,t,status,'checkin',nextCheckin(today));saveDiet();
  return{goal,base,observed,raw,next:daysTo(s.week.next),nextISO:s.week.next,changed:goal!==+lc.goal,checkedIn:true,status,paused:t.stale,recal:!observed,floor:want!==goal||cur!==+lc.goal};
}
/* configuração mudou no meio da semana: as metas da semana são refeitas na hora (sem contar como check-in) */
function invalidateWeek(){if(diet.settings.week)diet.settings.week.dirty=true}
/* metas da semana para a tela e para a IA (garante o check-in do dia, se for o caso) */
function weekPlan(){
  const tk=targetKcal(), W=diet.settings.week;
  return{tk,W,M:{kcal:W.kcal,prot:W.prot,carbs:W.carb,fatG:W.fat,sum:W.sum,warn:W.warn,pk:W.prot*4,ck:W.carb*4,fk:W.fat*9,wkg:W.weight}};
}
/* mudança de configuração: a meta atual é deslocada pelo efeito da mudança no plano — não é recriada do zero.
   Mudança grande de ingestão (≥200 kcal) abre fase nova; proteína e gordura não mexem na meta. Reestimativa do
   gasto inicial (calculadora) sem nenhum dado medido refaz a meta com a estimativa nova */
function applySettingsChange(planBefore,goalBefore,reestimate){
  const s=diet.settings, t=computeTDEE(), delta=planGoal()-planBefore;
  if(!delta)return'nada';
  if(reestimate&&t.observed==null){s.lastCoach=null;return'refeita'}
  if(!reestimate&&Math.abs(delta)>=200){startPhase(goalBefore,goalBefore+delta);return'fase'}
  if(s.lastCoach&&s.lastCoach.goal)s.lastCoach={date:s.lastCoach.date,goal:Math.round(+s.lastCoach.goal+delta)};
  return'ajuste';
}
/* o plano da meta automática fica dentro dos limites internos do app? */
function planProblem(){
  const s=diet.settings;
  if(s.mode==='fixed')return'';
  const g=planGoal(), lo=goalMin();
  if(g<lo)return`Com esse gasto inicial e esse ritmo, a meta ficaria em ${fmt(g)} kcal — abaixo do mínimo interno do app (${fmt(lo)} kcal). Reduza o ritmo ou revise o gasto inicial.`;
  if(g>GOAL_MAX)return`Com esses valores, a meta ficaria em ${fmt(g)} kcal — acima do máximo interno do app (${fmt(GOAL_MAX)} kcal). Revise o gasto inicial ou o ritmo.`;
  return'';
}
/* configurações vindas de backup, da nuvem ou de versões antigas: só valores possíveis; o resto volta ao padrão */
function sanitizeSettings(s){
  const num=(v,lo,hi)=>{const n=+v;return v!=null&&v!==''&&typeof v!=='boolean'&&isFinite(n)&&n>=lo&&n<=hi?n:null};
  if(!['deficit','maint','surplus','fixed'].includes(s.mode))s.mode='deficit';
  s.tdee0=num(s.tdee0,800,8000)??2800;
  s.protPerKg=num(s.protPerKg,1.2,3.5)??2.1;
  s.fatPct=num(s.fatPct,15,45)??25;
  if(s.ratePcts&&typeof s.ratePcts==='object')s.ratePcts={deficit:num(s.ratePcts.deficit,0.1,RATE_MAX.deficit)??0.47,surplus:num(s.ratePcts.surplus,0.1,RATE_MAX.surplus)??0.3};
  else delete s.ratePcts;
  if(s.rate!=null&&num(s.rate,0.05,3)==null)delete s.rate;
  if(s.ratePct!=null&&num(s.ratePct,0.1,1)==null)delete s.ratePct;
  if(s.fixed!=null){
    const k=s.fixed&&num(s.fixed.kcal,800,10000), g=v=>v==null||v===''?null:num(v,0,1000);
    s.fixed=k?{kcal:Math.round(k),prot:g(s.fixed.prot),carb:g(s.fixed.carb),fat:g(s.fixed.fat)}:null;
  }
  if(s.mode==='fixed'&&!s.fixed)s.mode='maint';
  if(s.phase!=null){const p=s.phase;if(!p||!okISO(p.start)||num(p.prior,800,8000)==null)delete s.phase;else p.priorSD=num(p.priorSD,50,1000)??PRIOR_SD0}
  if(s.lastCoach!=null&&(!s.lastCoach||!okISO(s.lastCoach.date)||num(s.lastCoach.goal,800,GOAL_MAX)==null))s.lastCoach=null;
  if(s.profile!=null){
    const p=s.profile;
    if(!p||num(p.age,14,100)==null||num(p.h,120,230)==null||num(p.w,25,350)==null)delete s.profile;
    else{if(p.bf!=null&&num(p.bf,3,60)==null)p.bf=null;if(!['m','f'].includes(p.sex))delete p.sex;if(num(p.act,1.1,2.5)==null)p.act=1.5;if(p.at&&!okISO(p.at))delete p.at;p.bfExam=!!p.bfExam}
  }
  if(s.progMode!=null&&!['conservador','flexivel'].includes(s.progMode))delete s.progMode;
  if(s.lastDeload!=null&&!okISO(s.lastDeload))delete s.lastDeload;
  if(s.incOverride!=null){if(typeof s.incOverride!=='object')delete s.incOverride;else for(const k in s.incOverride)if(num(s.incOverride[k],0.25,20)==null)delete s.incOverride[k]}
  if(s.aiAbout!=null&&typeof s.aiAbout!=='string')delete s.aiAbout;else if(s.aiAbout)s.aiAbout=s.aiAbout.slice(0,600);
  if(s.hevyFolder!=null&&!isFinite(+s.hevyFolder))s.hevyFolder=null;
  if(s.maintTarget!=null&&num(s.maintTarget,25,350)==null)delete s.maintTarget;
  if(s.checkinDay!=null&&!(Number.isInteger(+s.checkinDay)&&+s.checkinDay>=0&&+s.checkinDay<=6))delete s.checkinDay;
  if(s.week!=null){
    const w=s.week;
    if(!w||!okISO(w.start)||num(w.kcal,800,GOAL_MAX*2)==null||[w.prot,w.carb,w.fat].some(v=>num(v,0,2000)==null))delete s.week;
    else{
      /* soma e aviso nunca vêm prontos: recalculados dos gramas; próxima data precisa existir e caber na semana */
      w.prot=Math.round(+w.prot);w.carb=Math.round(+w.carb);w.fat=Math.round(+w.fat);w.kcal=Math.round(+w.kcal);
      w.sum=w.prot*4+w.carb*4+w.fat*9;w.warn=macroWarn(w.kcal,w.prot,w.carb,w.fat,w.carb===0);
      const gap=realISO(w.next)?dayNum(w.next)-dayNum(w.start):0;
      if(gap<1||gap>7)w.next=nextCheckin(w.start);
      if(!['deficit','maint','surplus','fixed'].includes(w.mode))w.mode=s.mode;
      if(w.kind!=='checkin')w.kind='ajuste';
      w.status=typeof w.status==='string'?w.status.slice(0,200):'metas da semana';
    }
  }
  if(s.checkins!=null)s.checkins=Array.isArray(s.checkins)?s.checkins.filter(c=>c&&okISO(c.date)&&num(c.kcal,800,GOAL_MAX*2)!=null).slice(-26):[];
  return s;
}
/* avisos dos macros (a mesma regra para a meta calculada e para metas vindas de backup) */
function macroWarn(goal,prot,carbs,fatG,carbAuto){
  const sum=prot*4+carbs*4+fatG*9;
  if(carbAuto&&carbs===0&&prot*4+fatG*9>goal)return`Proteína (${prot} g) e gordura (${fatG} g) já somam ${fmt(prot*4+fatG*9)} kcal — mais que a meta de ${fmt(goal)} kcal, e o carboidrato zerou. Revise a meta ou os mínimos de proteína e gordura.`;
  if(Math.abs(sum-goal)>Math.max(40,goal*0.03))return`Os macros somam ${fmt(sum)} kcal — ${fmt(Math.abs(sum-goal))} kcal ${sum>goal?'acima':'abaixo'} da meta de ${fmt(goal)}. Confira a prescrição.`;
  return'';
}
/* backup restaurado: as metas da semana são refeitas a partir das configurações validadas e da meta preservada */
function restoreWeek(){if(diet.settings.week)diet.settings.week.dirty='backup'}
function computeMacros(tk){
  /* proteína por kg de peso (tendência), gordura com um mínimo prático (% kcal, pelo menos ~0,6 g/kg), carbo
     preenche o resto. Na meta fixa, valem os gramas prescritos; o que faltar é calculado pela mesma regra.
     Confere se os macros fecham com a meta e avisa quando não fecham */
  const s=diet.settings, wkg=curWeight(), fx=s.mode==='fixed'&&s.fixed?s.fixed:{};
  const perKg=s.protPerKg||2.1, fatPct=s.fatPct||25, g=v=>Math.max(0,Math.round(+v));
  const prot=fx.prot!=null?g(fx.prot):Math.round(perKg*wkg);
  let fatG;
  if(fx.fat!=null)fatG=g(fx.fat);
  else{fatG=Math.round(tk.goal*fatPct/100/9);const minFat=Math.round(0.6*wkg);if(fatG<minFat)fatG=minFat}
  const rest=(tk.goal-prot*4-fatG*9)/4;
  const carbs=fx.carb!=null?g(fx.carb):Math.max(0,Math.round(rest));
  const sum=prot*4+carbs*4+fatG*9;
  const warn=macroWarn(tk.goal,prot,carbs,fatG,fx.carb==null&&rest<0);
  return{kcal:tk.goal,sum,prot,fatG,carbs,wkg,pk:prot*4,fk:fatG*9,ck:carbs*4,prescribed:fx.prot!=null||fx.fat!=null||fx.carb!=null,warn};
}
/* gasto em repouso para a estimativa inicial: Cunningham com % de gordura de exame (DEXA, Bod Pod, pesagem
   hidrostática); sem ele, ten Haaf 2014 (peso, altura, idade, sexo) — as duas validadas em quem treina */
function restingKcal(p){
  if(p.bf!=null&&p.bf>0&&p.bf<60&&p.bfExam)return{kcal:500+22*(p.w*(1-p.bf/100)),eq:'Cunningham'};
  return{kcal:11.936*p.w+587.728*(p.h/100)-8.129*p.age+191.027*(p.sex==='f'?0:1)+29.279,eq:'ten Haaf'};
}
/* "0,47% ≈ 0,40 kg/sem ≈ 440 kcal/dia" + avisos de ritmo */
function rateInfo(pct){
  const s=diet.settings, cap=RATE_MAX[s.mode]||1, v=Math.min(cap,Math.max(0.1,pct));
  const kg=v/100*curWeight(), kcal=kg*KCAL_PER_KG/7;
  let t='≈ '+fmt(kg.toFixed(2))+' kg/sem · ≈ '+fmt(Math.round(kcal))+' kcal/dia de '+(s.mode==='surplus'?'superávit':'déficit');
  if(pct>cap)t+=' · <b>limitado ao teto de '+fmt(cap)+'%/sem</b>';
  if(s.mode==='deficit'&&kcal>500)t+=' · déficits maiores tendem a dificultar o ganho de massa magra (o efeito apareceu por volta de 500 kcal/dia)';
  if(s.mode==='surplus'&&v<0.25)t+=' · abaixo de 0,25%/sem o ganho é bem conservador';
  return t;
}
function dietCoach(t,tk,rate,nEntries){

    h=`Calibrando: registre <b>peso</b> e <b>kcal</b> todos os dias.${need} Com ~1 semana de dados o gasto medido começa a entrar, e o peso dos seus dados cresce conforme eles ficam completos e consistentes (em geral 3–4 semanas). Até lá a meta parte ${s.phase&&s.phase.prior!==s.tdee0?'do gasto da fase anterior':'da estimativa inicial'} (~${fmt(t.tdee)} kcal): <b>${fmt(tk.goal)} kcal/dia</b>. Registros com peso: ${nEntries}.`;
    if(s.mode==='maint'&&maintInfo().tgt!=null){const m=maintInfo();h+=`<br><span style="font-size:12.5px">Manutenção com peso-alvo ${fmt(m.tgt)} kg: ${m.inBand?'você está dentro da faixa de ±'+fmt(MAINT_BAND)+' kg, então a meta acompanha o gasto':'você está '+(m.diff>0?'acima':'abaixo')+' da faixa de ±'+fmt(MAINT_BAND)+' kg, então a meta tem um leve '+(m.diff>0?'déficit':'superávit')+' de ~'+fmt(m.kc)+' kcal/dia'}.</span>`}
  }
  if(!t.stale&&tk.recal&&!tk.fixed&&s.lastCoach&&t.observed==null&&nEntries>0)h+=`<br><span style="font-size:12.5px">A meta fica em ${fmt(tk.goal)} kcal até o gasto poder ser medido (pelo menos ${MIN_KDAYS} dias com kcal e ~1 semana de pesagens na janela atual); só então os check-ins voltam a ajustá-la.</span>`;

  if(tk.floor)h+=`<br><span class="warnline" style="font-size:12.5px">⚠️ O plano calculado (${fmt(tk.raw)} kcal) passou dos limites internos do app; a meta ficou em ${fmt(tk.goal)} kcal. Revise o ritmo ou o gasto inicial.</span>`;
  if(t.observed!=null&&s.mode!=='fixed'&&t.avgK!=null&&Math.abs(t.avgK-tk.goal)>=200)h+=`<br><span style="font-size:12.5px">Sua média registrada (${fmt(t.avgK)} kcal) está ${fmt(Math.abs(Math.round(t.avgK-tk.goal)))} kcal ${t.avgK>tk.goal?'acima':'abaixo'} da meta. O ritmo real reflete o que você come; o app não muda a meta para compensar isso — ela continua sendo a estimativa para buscar o ritmo pedido.</span>`;

  if(t.stale)h=`⏸ <b>Sem dados recentes</b>: o último dia com peso e kcal registrados foi ${dt(t.endISO)} (há ${t.ageDays} dias). O gasto e o ritmo abaixo são daquela época${s.mode==='fixed'?'':', e a meta fica parada até você voltar a registrar'}.<br>`+h;
  if(pd!=null&&pd<SETTLE_DAYS)h+=`<br><span style="font-size:12.5px">Fase nova há ${pd} dia${pd===1?'':'s'}: as pesagens dos primeiros ${SETTLE_DAYS} dias contam pouco (água e glicogênio mudam rápido) e o gasto parte do valor anterior (~${fmt(t.prior)} kcal).</span>`;
  h+=`<br><span style="font-size:12px;color:var(--faint)">O gasto é medido na régua do seu registro: se você anota menos do que come, ele sai menor que o gasto real. Com registros e padrões consistentes, o acompanhamento do peso compensa parte desses erros — o ritmo continua sendo medido e a meta, reajustada aos poucos. A incerteza mostrada é só estatística: não inclui erro sistemático do registro nem a composição da mudança de peso (água, glicogênio, massa magra).</span>`;
  return h;

  }
  if(hist.length)h+=`<details style="margin-top:10px"><summary>Histórico (${hist.length} check-in${hist.length>1?'s':''})</summary><div style="margin-top:8px">`
    +hist.map(c=>`<div class="dhist" style="grid-template-columns:52px 1fr 1fr"><span class="dd">${c.date.slice(8,10)}/${c.date.slice(5,7)}</span><span>${fmt(c.kcal)} kcal · P${c.prot} C${c.carb} G${c.fat}</span><span style="color:var(--muted)">gasto ${fmt(c.tdee)}${c.measured?'':'*'} · ${fmt(c.weight)} kg</span></div>`).join('')
    +(hist.some(c=>!c.measured)?`<p class="note" style="font-size:11.5px;margin-top:6px">* gasto ainda estimado (sem dados suficientes para medir).</p>`:'')+'</div></details>';
  return h+'</div>';
}

    const bf=numBR(document.getElementById('cBF').value), sex=document.getElementById('cSex').value, act=+document.getElementById('cAct').value;
    if(!age||!hcm||!w){toast('Preencha idade, altura e peso');return}
    if(!inRange(age,14,100)||!inRange(hcm,120,230)||!inRange(w,25,350)||(bf!=null&&!inRange(bf,3,60))){toast('Confira: idade 14–100, altura 120–230 cm, peso 25–350 kg, gordura 3–60%');return}
    const bfExam=document.getElementById('cBFx').checked;
    const prof={age,h:hcm,w,bf:bf!=null?bf:null,sex,act,bfExam,at:todayISO()};
    const r=restingKcal(prof);
    const tdee=Math.round(r.kcal*act);
    const s=diet.settings, noData=computeTDEE().observed==null;
    const snap=JSON.stringify(s), planBefore=planGoal(), before=targetKcal().goal;
    s.tdee0=tdee;
    s.profile=prof;
    /* fase ancorada na estimativa por fórmula (sem dados medidos): passa a partir da estimativa nova */
    if(s.phase&&(s.phase.fromData===false||(s.phase.fromData==null&&noData)))s.phase.prior=tdee;
    const prob=planProblem();
    if(prob){restoreSettings(snap);showPlanWarn(prob);return}
    applySettingsChange(planBefore,before,true);
    invalidateWeek();
    await saveDiet();await touchAndPush();
    toast('✓ TDEE inicial ('+r.eq+'): '+fmt(tdee)+' kcal/dia'+(r.eq==='ten Haaf'&&(age<18||age>35)?' · idade fora dos 18–35 anos do estudo':''));
    renderDiet();
  };
  view.querySelectorAll('.dhist .del').forEach(b=>b.onclick=async()=>{
    if(confirm('Apagar o registro de '+b.dataset.dd+'?')){delete diet.entries[b.dataset.dd];await saveDiet();await touchAndPush();renderDiet()}
  });
  document.getElementById('dexp').onclick=()=>{
    let rows=['sep=;','Data;Peso (kg);Tendência (kg);Kcal;Proteína (g);Incompleto'];
    const tr=computeTrend();
    for(const d of dietDates()){
      const e=diet.entries[d];
      rows.push([d.split('-').reverse().join('/'),e.weight!=null?String(e.weight).replace('.',','):'',tr[d]!=null?tr[d].toFixed(2).replace('.',','):'',e.kcal??'',e.prot??'',e.inc?'sim':''].join(';'));
    }
    download('dieta.csv','\uFEFF'+rows.join('\r\n'),'text/csv;charset=utf-8');
    toast('✓ CSV exportado');
  };
}
function drawDietChart(){
  const cv=document.getElementById('dchart');if(!cv)return;
  const dpr=window.devicePixelRatio||1, W=cv.clientWidth, H=220;
  cv.width=W*dpr;cv.height=H*dpr;
  const ctx=cv.getContext('2d');ctx.scale(dpr,dpr);
  const trend=computeTrend();
  const all=dietDates().filter(d=>diet.entries[d].weight!=null&&diet.entries[d].weight!=='');
  ctx.font='11px ui-monospace,monospace';
  if(all.length<2){ctx.fillStyle='#5c636c';ctx.fillText('Registre pesagens para ver o gráfico',20,110);return}
  const endT=new Date(all[all.length-1]).getTime();
  const fromT=dietRange===0?new Date(all[0]).getTime():endT-dietRange*86400000;
  const ds=all.filter(d=>new Date(d).getTime()>=fromT);
  if(ds.length<2){ctx.fillStyle='#5c636c';ctx.fillText('Poucos dados no período',20,110);return}
  let mn=Infinity,mx=-Infinity;
  ds.forEach(d=>{mn=Math.min(mn,+diet.entries[d].weight,trend[d]);mx=Math.max(mx,+diet.entries[d].weight,trend[d])});
  const pad=(mx-mn)*0.15||0.5;mn-=pad;mx+=pad;
  const X=d=>38+((new Date(d).getTime()-fromT)/(endT-fromT||1))*(W-50);
  const Y=v=>H-22-((v-mn)/(mx-mn))*(H-40);
  ctx.strokeStyle='#2b3138';ctx.fillStyle='#5c636c';ctx.lineWidth=1;
  for(let i=0;i<=3;i++){
    const v=mn+(mx-mn)*i/3, y=Y(v);
    ctx.beginPath();ctx.moveTo(36,y);ctx.lineTo(W-8,y);ctx.stroke();
    ctx.fillText(v.toFixed(1),2,y+4);
  }
  ctx.fillStyle='#6b7280';
  ds.forEach(d=>{ctx.beginPath();ctx.arc(X(d),Y(+diet.entries[d].weight),2.6,0,7);ctx.fill()});
  ctx.strokeStyle='#f5a623';ctx.lineWidth=2.5;ctx.lineJoin='round';ctx.beginPath();
  ds.forEach((d,i)=>{const x=X(d),y=Y(trend[d]);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});
  ctx.stroke();
}

/* ============ Hevy: fonte do programa (rotinas) e do histórico (treinos) ============ */
/* Cada exercício é identificado pelo código do template no Hevy (id "hevy_<template>"), o mesmo nas rotinas
   e nos treinos registrados — o histórico se liga sozinho, sem vínculo manual. No app ficam só o RIR alvo e o incremento. */
const HEVY_API='https://api.hevyapp.com/v1/';
const K_HV2='ul_hevy_v2', K_HFOLD='ul_hevyfolders_v1', K_HTYPES='ul_hevytypes_v1'; /* histórico refeito uma vez com os tipos de série */
let hevyFolders=[], hevyErr='', hevyBusy=null;
const normName=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
const hevyExId=tid=>'hevy_'+tid;
async function hevyGet(path){
  const r=await fetch(HEVY_API+path,{headers:{'api-key':hevyKey}});
  if(r.status===404)return null; /* página além da última / lista vazia */
  if(!r.ok){
    let d='';try{const j=await r.json();d=j&&(j.error||j.message)||''}catch(_){}
    throw new Error('HTTP '+r.status+(r.status===401?' — chave do Hevy inválida':(d?' — '+d:'')));
  }
  return r.json();
}
async function hevyAll(path,key){
  const out=[];
  for(let page=1;page<=200;page++){
    const d=await hevyGet(path+(path.includes('?')?'&':'?')+'page='+page+'&pageSize=10');
    const list=(d&&d[key])||[];
    out.push(...list);
    if(!d||!list.length||(d.page_count!=null?page>=d.page_count:list.length<10))break;
  }
  return out;
}
/* treino registrado no Hevy → sessão do histórico (aquecimento fora; RIR = 10 − RPE) */
function hevySession(w){
  const entries=[];
  for(const he of [...(w.exercises||[])].sort((a,b)=>(a.index??0)-(b.index??0))){
    const sets=(he.sets||[]).filter(s=>s.type!=='warmup').map(s=>{
      const o={w:s.weight_kg!=null?+s.weight_kg:null,r:s.reps!=null?+s.reps:null,
        rir:s.rpe!=null?Math.max(0,10-s.rpe):null}; /* exato: RPE 8,5 → RIR 1,5 */
      if(s.type==='dropset'||s.type==='failure')o.t=s.type; /* drop-set fica fora da decisão, como na rotina */
      return o;
    });
    if(!sets.some(s=>s.r!=null))continue;
    entries.push({exId:he.exercise_template_id?hevyExId(he.exercise_template_id):'hevy_'+normName(he.title),exName:he.title||'Exercício',sets});
  }
  if(!entries.length)return null;
  return{id:'hv_'+w.id,hevyId:w.id,hevyRid:w.routine_id||null,date:w.start_time||w.created_at||new Date().toISOString(),
    workoutId:w.routine_id?'hvr_'+w.routine_id:'hevy',workoutName:w.title||'Treino Hevy',entries};
}
const hevyRirDefault=repMin=>repMin>=12?[0,1]:(repMin<=6?[2,3]:[1,2]);
/* moda das cargas das séries de trabalho da rotina (empate → maior) = carga planejada */
function hevyPlanW(work){
  const c={};
  for(const s of work)if(s.weight_kg!=null&&+s.weight_kg>0)c[+s.weight_kg]=(c[+s.weight_kg]||0)+1;
  let w=null,best=0;
  for(const k in c)if(c[k]>best||(c[k]===best&&+k>w)){best=c[k];w=+k}
  return w;
}
/* rotinas do Hevy → programa. RIR alvo = 10 − RPE das séries da rotina; carga da rotina = carga planejada.
   Sem RPE na rotina, vale o RIR ajustado no app (ou o padrão). O incremento continua sendo ajuste do app. */
function hevyBuildProgram(routines,old){
  const prev={}, prevOcc={};
  for(const wo of old)for(const ex of wo.exercises){
    const k=ex.hevyId?hevyExId(ex.hevyId):ex.id;
    if(!prev[k])prev[k]=ex;
    prevOcc[wo.id+'|'+k]=ex;
  }
  const sel=hevyFolders.some(f=>f.id===diet.settings.hevyFolder)?diet.settings.hevyFolder:null;
  const fIdx={};
  for(const f of hevyFolders)fIdx[f.id]=f.index??0;
  const list=routines.filter(rt=>sel==null||rt.folder_id===sel).map((rt,i)=>({rt,i}))
    .sort((a,b)=>((fIdx[a.rt.folder_id]??-1)-(fIdx[b.rt.folder_id]??-1))||a.i-b.i).map(x=>x.rt);
  return list.map(rt=>({
    id:'hvr_'+rt.id,name:rt.title||'Treino',hevyRid:rt.id,folderId:rt.folder_id??null,created:rt.created_at||null,
    exercises:[...(rt.exercises||[])].sort((a,b)=>(a.index??0)-(b.index??0)).filter(he=>he.exercise_template_id).map(he=>{
      const id=hevyExId(he.exercise_template_id), o=prevOcc['hvr_'+rt.id+'|'+id]||prev[id];
      const work=(he.sets||[]).filter(s=>s.type!=='warmup'&&s.type!=='dropset');
      const rr=s=>[s.rep_range&&s.rep_range.start!=null?+s.rep_range.start:(s.reps!=null?+s.reps:null),
        s.rep_range&&s.rep_range.end!=null?+s.rep_range.end:(s.reps!=null?+s.reps:null)];
      let lo=null,hi=null;
      for(const s of work){
        const[a,b]=rr(s);
        if(a!=null)lo=lo==null?a:Math.min(lo,a);
        if(b!=null)hi=hi==null?b:Math.max(hi,b);
      }
      /* série a série (carga, faixa, RPE): top set + back-offs são decididos pelo grupo mais pesado */
      const plan=work.map(s=>{const[a,b]=rr(s);return{w:s.weight_kg!=null&&+s.weight_kg>0?+s.weight_kg:null,lo:a,hi:b??a,rpe:s.rpe!=null&&s.rpe!==''&&+s.rpe>0?+s.rpe:null}});
      const repMin=lo??o?.repMin??8, repMax=Math.max(hi??o?.repMax??12,repMin);
      const rd=hevyRirDefault(repMin);
      const rpes=work.map(s=>s.rpe).filter(v=>v!=null&&v!=='').map(Number).filter(v=>v>0);
      const fromHevy=rpes.length>0;
      return{id,hevyId:he.exercise_template_id,name:he.title||o?.name||'Exercício',sets:Math.max(1,work.length),repMin,repMax,
        rirMin:fromHevy?Math.max(0,10-Math.max(...rpes)):(o?.rirMin??rd[0]),
        rirMax:fromHevy?Math.max(0,10-Math.min(...rpes)):(o?.rirMax??rd[1]),
        rirFromHevy:fromHevy,planW:hevyPlanW(work),plan,
        inc:prev[id]?.inc??(repMin<=8?2.5:1.25),rest:he.rest_seconds??o?.rest??120};
    })
  }));
}
/* versão anterior: sessões registradas no próprio app apontavam para exercícios vinculados → passam a usar o código do Hevy */
function hevyMigrateLegacy(old){
  const map={};
  for(const wo of old)for(const ex of wo.exercises)if(ex.hevyId&&ex.id!==hevyExId(ex.hevyId))map[ex.id]=hevyExId(ex.hevyId);
  for(const s of history)if(!s.hevyId)for(const e of s.entries)if(map[e.exId])e.exId=map[e.exId];
}
/* full=true (ou 1ª vez nesta versão): refaz todo o histórico do Hevy; senão, só o que mudou desde a última vez
   (treinos novos, editados ou apagados no Hevy) */
async function hevySync(full){
  if(!hevyKey)return{n:0};
  if(hevyBusy)return hevyBusy;
  hevyBusy=(async()=>{
    const started=new Date().toISOString();
    try{
      const routines=await hevyAll('routines','routines');
      try{hevyFolders=(await hevyAll('routine_folders','routine_folders')).map(f=>({id:f.id,title:f.title,index:f.index}));await sSet(K_HFOLD,hevyFolders)}catch(_){}
      const old=program, sig0=JSON.stringify([program,history]);
      const firstRun=!(await sGet(K_HV2)), typesDone=!!(await sGet(K_HTYPES));
      let n=0;
      if(full||firstRun||!hevyLast||!typesDone){
        hevyMigrateLegacy(old);
        const fresh=(await hevyAll('workouts','workouts')).map(hevySession).filter(Boolean);
        const had=new Set(history.filter(h=>h.hevyId).map(h=>h.hevyId));
        n=fresh.filter(s=>!had.has(s.hevyId)).length;
        history=history.filter(h=>!h.hevyId).concat(fresh);
      }else{
        const since=new Date(new Date(hevyLast).getTime()-10*60000).toISOString(); /* margem de 10 min */
        for(const ev of await hevyAll('workouts/events?since='+encodeURIComponent(since),'events')){
          const wid=ev.type==='deleted'?ev.id:ev.workout&&ev.workout.id;
          if(!wid)continue;
          const had=history.some(h=>h.hevyId===wid);
          history=history.filter(h=>h.hevyId!==wid);
          if(ev.type!=='deleted'){const s=hevySession(ev.workout);if(s){history.push(s);if(!had)n++}}
        }
      }
      history.sort((a,b)=>new Date(a.date)-new Date(b.date));
      program=hevyBuildProgram(routines,old);
      if(!program.find(w=>w.id===selWorkout))selWorkout=program[0]?.id;
      const changed=JSON.stringify([program,history])!==sig0;
      if(changed){await saveProgram();await saveHistory();await touchAndPush()}
      if(firstRun)await sSet(K_HV2,1);
      if(!typesDone)await sSet(K_HTYPES,1);
      hevyLast=started;await sSet(K_HSYNC,hevyLast);
      hevyErr='';
      return{n,changed,shown:program.length,total:history.filter(h=>h.hevyId).length};
    }catch(e){
      hevyErr=e&&e.message?e.message:'rede/CORS';
      return{n:0,err:hevyErr};
    }
  })();
  try{return await hevyBusy}finally{hevyBusy=null}
}
/* faixa com a hora da última atualização e o botão ↻ (aba Progressão) */
function hevyBar(){
  if(!hevyKey)return '';
  const when=hevyLast?new Date(hevyLast).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'—';
  return `<div class="hevybar"><span>🔗 Hevy · ${hevyErr?'<b style="color:var(--hold)">falhou: '+esc(hevyErr)+'</b>':'atualizado '+when}</span><button class="mini up2" id="hvpull">↻ Atualizar</button></div>`;
}
function bindHevyBar(){
  const b=document.getElementById('hvpull');
  if(!b)return;
  b.onclick=async()=>{
    b.disabled=true;b.textContent='Atualizando…';
    const r=await hevySync(false);
    toast(r.err?'⚠️ Hevy: '+r.err:(r.n?'✓ '+r.n+' treino(s) novo(s) do Hevy':'✓ Hevy em dia'));
    render();
  };
}

/* ============ util ============ */
const numBR=v=>{if(v==null||v==='')return null;const n=parseFloat(String(v).replace(',','.'));return isNaN(n)?null:n};
const inRange=(v,lo,hi)=>v!=null&&isFinite(v)&&v>=lo&&v<=hi;
/* data AAAA-MM-DD que existe no calendário, entre 2000 e 2100 (pode ser futura: próximo check-in) */
function realISO(d){
  if(typeof d!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(d))return false;
  const[y,m,dd]=d.split('-').map(Number), t=new Date(y,m-1,dd);
  return t.getFullYear()===y&&t.getMonth()===m-1&&t.getDate()===dd&&y>=2000&&y<=2100;
}
/* data AAAA-MM-DD que existe de verdade (2026-02-31 não passa), entre 2000 e hoje */
function okISO(d){
  if(typeof d!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(d))return false;
  const[y,m,dd]=d.split('-').map(Number), t=new Date(y,m-1,dd);
  return t.getFullYear()===y&&t.getMonth()===m-1&&t.getDate()===dd&&d>='2000-01-01'&&d<=todayISO();
}
/* registros de dieta vindos de backup: só datas válidas e números plausíveis */
function cleanDietEntries(src){
  const out={};let bad=0;
  const num=(v,lo,hi)=>{const n=typeof v==='string'?numBR(v):(v==null||v===''?null:+v);return inRange(n,lo,hi)?n:null};
  for(const[d,e]of Object.entries(src||{})){
    if(!okISO(d)||!e||typeof e!=='object'){bad++;continue}
    const o={weight:num(e.weight,25,350),kcal:num(e.kcal,0,10000),prot:num(e.prot,0,600),inc:!!e.inc};
    if((e.weight!=null&&e.weight!==''&&o.weight==null)||(e.kcal!=null&&e.kcal!==''&&o.kcal==null))bad++;
    if(o.weight!=null||o.kcal!=null||o.prot!=null||o.inc)out[d]=o;
  }
  return{entries:out,bad};
}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._to);t._to=setTimeout(()=>t.classList.remove('show'),2600)}
/* ============ PIN lock ============ */
const PIN_H=2085891405; /* hash do PIN — o código não guarda o PIN em texto */
function djb2(s){let h=5381;for(let i=0;i<s.length;i++)h=((h*33)^s.charCodeAt(i))>>>0;return h}
let pinBuf='';
function pinInit(){
  let ok=false;try{ok=sessionStorage.getItem('ul_unlocked')==='1'}catch(e){}
  const L=document.getElementById('lock');
  if(ok){L.remove();boot();return}
  L.querySelectorAll('.pinpad button').forEach(b=>b.onclick=()=>{
    const k=b.dataset.k;if(k==null)return;
    if(k==='del')pinBuf=pinBuf.slice(0,-1);
    else if(pinBuf.length<4)pinBuf+=k;
    L.querySelectorAll('.pindots span').forEach((s,i)=>s.classList.toggle('f',i<pinBuf.length));
    if(pinBuf.length===4){
      if(djb2(pinBuf)===PIN_H){
        try{sessionStorage.setItem('ul_unlocked','1')}catch(e){}
        L.remove();boot();
      }else{
        L.classList.add('err');
        setTimeout(()=>{L.classList.remove('err');pinBuf='';L.querySelectorAll('.pindots span').forEach(s=>s.classList.remove('f'))},350);
      }
    }
  });
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});
pinInit();
