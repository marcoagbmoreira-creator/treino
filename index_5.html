<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Progressão — Upper/Lower 3×</title>
<style>
:root{
  --bg:#101214; --surface:#1a1d21; --surface2:#22262b; --border:#2b3138;
  --text:#e9ebee; --muted:#8b929b; --faint:#5c636c;
  --up:#4ade80; --keep:#fbbf24; --hold:#f87171; --accent:#f5a623;
  --radius:14px;
  --mono:ui-monospace,'SF Mono','Cascadia Mono',Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;padding-bottom:90px}
.wrap{max-width:640px;margin:0 auto;padding:0 14px}

/* header */
header{padding:22px 0 14px;border-bottom:1px solid var(--border);margin-bottom:16px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.18em;color:var(--accent);text-transform:uppercase}
h1{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin-top:2px}
h1 small{display:block;font-size:13px;font-weight:500;color:var(--muted);letter-spacing:0;margin-top:3px}
.barload{display:flex;gap:3px;margin-top:12px;height:6px}
.barload span{flex:1;border-radius:2px;background:var(--surface2)}
.barload span.on{background:var(--accent)}

/* tabs */
nav{position:fixed;bottom:0;left:0;right:0;background:rgba(16,18,20,.96);backdrop-filter:blur(10px);border-top:1px solid var(--border);display:flex;z-index:50}
nav button{flex:1;padding:13px 4px max(13px,env(safe-area-inset-bottom));background:none;border:none;color:var(--faint);font:600 12px/1 inherit;letter-spacing:.04em;cursor:pointer}
nav button .ic{display:block;font-size:18px;margin-bottom:4px}
nav button.active{color:var(--accent)}

/* cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.card h3{font-size:15px;font-weight:700;letter-spacing:-.01em}
.sub{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:2px}

/* workout chips */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{padding:9px 16px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--muted);font-weight:700;font-size:14px;cursor:pointer}
.chip.sel{background:var(--accent);border-color:var(--accent);color:#131313}

/* suggestion badge — plate edge signature */
.decide{display:flex;align-items:center;gap:10px;margin:10px 0 12px;padding:9px 12px;border-radius:10px;background:var(--surface2);border-left:5px solid var(--faint);font-size:13px}
.decide b{font-family:var(--mono);font-size:13px;letter-spacing:.06em}
.decide.up{border-left-color:var(--up)} .decide.up b{color:var(--up)}
.decide.keep{border-left-color:var(--keep)} .decide.keep b{color:var(--keep)}
.decide.hold{border-left-color:var(--hold)} .decide.hold b{color:var(--hold)}
.decide.stall{border-left-color:#c084fc} .decide.stall b{color:#c084fc}
.decide.first{border-left-color:var(--faint)} .decide.first b{color:var(--muted)}

/* set rows */
.sethead,.setrow{display:grid;grid-template-columns:30px 1fr 1fr 1fr 44px;gap:8px;align-items:center}
.lastline{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:10px;padding-top:8px;border-top:1px solid var(--border)}
.hevybar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 14px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.card .hevybar{margin:12px 0 0}
.rotline{font-size:12.5px;color:var(--muted);margin-top:8px}
.rotline b{color:var(--accent)}
.rotline.ok{color:var(--up)}
.incsel{background:transparent;border:0;border-bottom:1px dashed currentColor;color:inherit;font:inherit;padding:0 1px;-webkit-appearance:none;appearance:none;cursor:pointer}
.hevybar .mini{white-space:nowrap;padding:6px 0}
.fld select{width:100%;padding:10px 8px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font:600 13px inherit}

.sethead{font-family:var(--mono);font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.1em;margin-bottom:6px;padding:0 2px}
.setrow{margin-bottom:8px}
.setrow .n{font-family:var(--mono);font-size:13px;color:var(--faint);text-align:center}
.setrow input{width:100%;padding:11px 8px;background:var(--bg);border:1px solid var(--border);border-radius:9px;color:var(--text);font:600 16px var(--mono);text-align:center;-moz-appearance:textfield}
.setrow input::-webkit-outer-spin-button,.setrow input::-webkit-inner-spin-button{-webkit-appearance:none}
.setrow input:focus{outline:none;border-color:var(--accent)}
.setrow input.done{border-color:#3a4a3f}

/* buttons */
.btn{display:block;width:100%;padding:15px;border:none;border-radius:12px;background:var(--accent);color:#131313;font:800 16px inherit;letter-spacing:.01em;cursor:pointer;margin-top:6px}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--surface2);color:var(--text);font-weight:600;font-size:14px;padding:12px;border:1px solid var(--border)}
.btn.danger{background:none;border:1px solid #4a2b2b;color:var(--hold)}
.btn:disabled{opacity:.45}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* program editor */
.exedit{background:var(--surface2);border-radius:10px;padding:12px;margin-top:10px}
.exedit input[type=text]{width:100%;padding:10px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font:600 14px inherit;margin-bottom:8px}
.grid6{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fld label{display:block;font-family:var(--mono);font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.08em;margin-bottom:3px}
.fld input{width:100%;padding:9px 6px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font:600 14px var(--mono);text-align:center}
.mini{background:none;border:none;color:var(--muted);font:600 13px inherit;cursor:pointer;padding:6px 8px}
.mini.red{color:var(--hold)}
.mini.up2{color:var(--accent)}
.exhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.drag{color:var(--faint);font-size:15px}

/* history */
.hist{border-bottom:1px solid var(--border);padding:12px 2px}
.hist:last-child{border:none}
.hist .d{font-family:var(--mono);font-size:12px;color:var(--accent)}
.hist .t{font-weight:700;margin:1px 0 4px}
.hist .s{font-family:var(--mono);font-size:12px;color:var(--muted);line-height:1.7}

/* misc */
.note{font-size:13px;color:var(--muted);line-height:1.55}
.note b{color:var(--text)}
details{margin-top:10px}
summary{cursor:pointer;font-weight:700;font-size:14px;color:var(--accent);list-style:none}
summary::before{content:'▸ '}
details[open] summary::before{content:'▾ '}
details .note{margin-top:8px}
/* AI */
.ai-out{background:var(--surface2);border-radius:10px;padding:14px;margin-top:12px;font-size:14px;line-height:1.65}
.ai-out p{margin:0 0 8px}
.ai-out h4{font-size:14px;color:var(--accent);margin:10px 0 4px}
.ai-out ul{margin:6px 0 10px 18px}
.ai-out ol{margin:6px 0 10px 20px}
.ai-out li{margin-bottom:4px}
.ai-out li ul,.ai-out li ol{margin:4px 0 4px 14px}
.ai-out h4:first-child{margin-top:0}
.ai-out hr{border:0;border-top:1px solid var(--border);margin:12px 0}
.ai-out code{font:12.5px var(--mono);background:var(--bg);padding:1px 4px;border-radius:4px}
.ai-stuck{margin-top:12px;font-size:13px}
.ai-tbl{overflow-x:auto;margin:6px 0 10px}
.ai-out table{border-collapse:collapse;font-size:13px;line-height:1.45}
.ai-out th,.ai-out td{border:1px solid var(--border);padding:5px 7px;text-align:left;vertical-align:top}
.ai-out th{color:var(--accent);font-weight:600}
textarea#aiq,textarea#aiabout{width:100%;padding:11px;background:var(--bg);border:1px solid var(--border);border-radius:10px;color:var(--text);font:inherit;resize:vertical;min-height:60px}
textarea#aiq:focus,textarea#aiabout:focus{outline:none;border-color:var(--accent)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--faint);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}
/* diet */
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.stat{background:var(--surface2);border-radius:10px;padding:11px 12px}
.stat .v{font-family:var(--mono);font-size:19px;font-weight:700;letter-spacing:-.01em}
.stat .l{font-family:var(--mono);font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.08em;margin-top:2px}
.stat .v.up{color:var(--up)}.stat .v.down{color:var(--hold)}.stat .v.acc{color:var(--accent)}
#dchart{width:100%;height:220px;display:block;margin-top:10px}
.seg{display:flex;gap:6px;margin-top:10px}
.seg button{flex:1;padding:8px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--muted);font:700 12px inherit;cursor:pointer}
.seg button.on{background:var(--accent);border-color:var(--accent);color:#131313}
.modegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.modegrid button{padding:11px 6px;border-radius:10px;border:1px solid var(--border);background:var(--surface2);color:var(--muted);font:700 13px inherit;cursor:pointer}
.modegrid button.on{background:var(--accent);border-color:var(--accent);color:#131313}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dgrid.g3{grid-template-columns:1fr 1fr 1fr}
.dfld label{display:block;font-family:var(--mono);font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}
.dfld input{width:100%;padding:11px 8px;background:var(--bg);border:1px solid var(--border);border-radius:9px;color:var(--text);font:600 16px var(--mono);text-align:center}
.dfld input:focus{outline:none;border-color:var(--accent)}
.chkrow{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px;color:var(--muted)}
.chkrow input{width:18px;height:18px;accent-color:var(--accent)}
.dhist{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding:9px 2px;border-bottom:1px solid var(--border);font-family:var(--mono);font-size:12.5px}
.dhist:last-child{border:none}
.dhist .dd{color:var(--accent)}
.dhist .del{color:var(--hold);background:none;border:none;font-size:15px;cursor:pointer;padding:2px 6px}
.warnline{color:var(--hold)}
.coach{margin-top:12px;padding:12px;border-radius:10px;background:var(--surface2);border-left:5px solid var(--accent);font-size:13.5px;line-height:1.55}
.coach b{font-family:var(--mono)}
/* PIN lock */
#lock{position:fixed;inset:0;background:var(--bg);z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px}
#lock h2{font-size:20px;font-weight:800;letter-spacing:-.01em}
.pindots{display:flex;gap:14px}
.pindots span{width:14px;height:14px;border-radius:50%;border:2px solid var(--faint)}
.pindots span.f{background:var(--accent);border-color:var(--accent)}
.pinpad{display:grid;grid-template-columns:repeat(3,72px);gap:12px}
.pinpad button{height:64px;border-radius:16px;border:1px solid var(--border);background:var(--surface);color:var(--text);font:700 22px var(--mono);cursor:pointer;-webkit-tap-highlight-color:transparent}
.pinpad button:active{background:var(--surface2)}
.pinpad button.ghostk{background:none;border:none;font-size:14px;color:var(--muted)}
#lock.err .pindots{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
/* dashboard */
.calhead{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.calhead .mname{font:700 15px inherit;text-transform:capitalize}
.calhead button{width:38px;height:38px;border-radius:10px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:16px;cursor:pointer}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:10px}
.cal .dow{font-family:var(--mono);font-size:10px;color:var(--faint);text-align:center;text-transform:uppercase;padding:4px 0}
.cal .day{aspect-ratio:1;border-radius:10px;background:var(--surface2);border:1.5px solid transparent;display:flex;align-items:center;justify-content:center;font:600 13px var(--mono);color:var(--muted);cursor:pointer;position:relative;-webkit-tap-highlight-color:transparent}
.cal .day.blank{background:none;cursor:default}
.cal .day.t{background:#2b2310;border-color:#5c4a15;color:var(--accent)}
.cal .day .wdot{width:5px;height:5px;border-radius:50%;background:var(--up);position:absolute;bottom:5px;left:50%;transform:translateX(-50%)}
.cal .day.today{border-color:var(--accent)}
.cal .day.sel{outline:2px solid var(--accent);outline-offset:1px}
.cal .day.future{opacity:.35;cursor:default}
.legend{display:flex;gap:16px;margin-top:10px;font-size:11.5px;color:var(--muted);font-family:var(--mono)}
.legend .sq{display:inline-block;width:11px;height:11px;border-radius:3px;background:#2b2310;border:1.5px solid #5c4a15;vertical-align:-1px;margin-right:5px}
.legend .dt{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--up);vertical-align:1px;margin-right:6px}
.streakbig{display:flex;align-items:baseline;gap:8px}
.streakbig .n{font:800 34px var(--mono);color:var(--accent)}
.streakbig .u{font-size:12px;color:var(--muted)}
#tonchart{width:100%;height:150px;display:block;margin-top:10px}
.daydetail{margin-top:12px;background:var(--surface2);border-radius:10px;padding:12px;font-size:13.5px}
.daydetail .dtitle{font-family:var(--mono);font-size:12px;color:var(--accent);margin-bottom:6px}
.daydetail .s{font-family:var(--mono);font-size:12px;color:var(--muted);line-height:1.7}
.macbar{display:flex;height:14px;border-radius:7px;overflow:hidden;margin-top:12px;background:var(--bg)}
.macbar span{height:100%}
.m-p{background:#4ade80}.m-c{background:#f5a623}.m-f{background:#60a5fa}
.maclegend{display:flex;gap:14px;margin-top:8px;font-family:var(--mono);font-size:11px;color:var(--muted);flex-wrap:wrap}
.maclegend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(20px);background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:11px 18px;border-radius:999px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:99;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{text-align:center;color:var(--faint);padding:30px 10px;font-size:14px}
.tag{font-family:var(--mono);font-size:11px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:2px 7px;color:var(--muted)}
.loading{text-align:center;padding:60px 0;color:var(--faint);font-family:var(--mono);font-size:13px;letter-spacing:.1em}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="lock">
  <div class="eyebrow">Acesso restrito</div>
  <h2>Digite o PIN</h2>
  <div class="pindots"><span></span><span></span><span></span><span></span></div>
  <div class="pinpad">
    <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
    <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
    <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
    <button class="ghostk" data-k="del">apagar</button><button data-k="0">0</button><button class="ghostk" style="visibility:hidden">·</button>
  </div>
</div>
<div class="wrap">
  <header>
    <div class="eyebrow">Dupla progressão autorregulada</div>
    <h1>Progressão de Carga <small>Upper · Lower · 3×/semana — V-taper</small></h1>
    <div class="barload" id="weekbar"></div>
  </header>
  <main id="view"><div class="loading">CARREGANDO…</div></main>
</div>

<nav>
  <button data-tab="home" class="active"><span class="ic">📊</span>Resumo</button>
  <button data-tab="train"><span class="ic">📈</span>Progressão</button>
  <button data-tab="diet"><span class="ic">⚖️</span>Dieta</button>
  <button data-tab="ai"><span class="ic">🧠</span>Análise</button>
  <button data-tab="data"><span class="ic">📤</span>Dados</button>
</nav>
<div class="toast" id="toast"></div>

<script>
/* ============ state & storage ============ */
const K_PROG='ul_program_v1', K_HIST='ul_history_v1', K_KEY='ul_apikey_v1', K_MODEL='ul_aimodel_v1', K_GH='ul_ghtoken_v1', K_GIST='ul_gist_v1', K_UPD='ul_updated_v1', K_DIET='ul_diet_v1', K_HEVY='ul_hevykey_v1', K_HSYNC='ul_hevysync_v1';
let program=[], history=[], tab='home', selWorkout=null, memOnly=false, apiKey='', aiModel='gemini-3.8-flash', ghToken='', gistId='', updatedAt=0, syncState='', hevyKey='', hevyLast='';
let diet={entries:{},settings:{mode:'deficit',rate:0.4,protTarget:180,protPerKg:2.1,fatPct:25,tdee0:2820}}, dietRange=30, homeMonth=new Date(), homeSel=null;

const uid=()=>Math.random().toString(36).slice(2,9);

async function sGet(k){
  if(window.storage){try{const r=await window.storage.get(k);return r?JSON.parse(r.value):null}catch(e){return null}}
  try{const v=localStorage.getItem('pt_'+k);return v?JSON.parse(v):null}catch(e){return null}
}
async function sSet(k,v){
  if(window.storage){try{await window.storage.set(k,JSON.stringify(v));return}catch(e){}}
  try{localStorage.setItem('pt_'+k,JSON.stringify(v))}catch(e){memOnly=true}
}

async function boot(){
  program=await sGet(K_PROG)||[];
  history=await sGet(K_HIST)||[];
  apiKey=await sGet(K_KEY)||'';
  aiModel=await sGet(K_MODEL)||'gemini-3.8-flash';
  /* migração única: modelo salvo da geração 1.x/2.x (2.0 já desativado; 2.5 era o padrão antigo) → novo padrão */
  if(!(await sGet('ul_aimig_v1'))){if(/^gemini-(1|2)\./.test(aiModel)){aiModel='gemini-3.8-flash';await sSet(K_MODEL,aiModel)}await sSet('ul_aimig_v1',1)}
  ghToken=await sGet(K_GH)||'';
  gistId=await sGet(K_GIST)||'';
  updatedAt=await sGet(K_UPD)||0;
  const dd=await sGet(K_DIET);
  if(dd){diet.entries=dd.entries||{};diet.settings=sanitizeSettings(Object.assign(diet.settings,dd.settings||{}))}
  hevyKey=await sGet(K_HEVY)||'';
  hevyLast=await sGet(K_HSYNC)||'';
  keysAt=Object.assign({hevy:0,gemini:0},await sGet(K_KEYAT)||{});
  if(ghToken&&gistId)await cloudPull();
  if(secretsNote)toast(secretsNote);
  if(secretsNeedPush)cloudPush(); /* chaves deste aparelho ainda não estão (ou estão mais velhas) na nuvem */
  hevyFolders=await sGet(K_HFOLD)||[];
  /* migração: exercícios sem tempo de descanso ganham um pela faixa de reps */
  for(const wo of program)for(const ex of wo.exercises){
    if(ex.rest==null)ex.rest=ex.repMin<=6?180:(ex.repMin<=8?150:(ex.repMin<=10?120:75));
  }
  selWorkout=program[0]?.id;
  render();
  if(hevyKey){
    const firstHv=!(await sGet(K_HV2));
    if(firstHv&&!secretsNote)toast('Atualizando do Hevy…');
    hevySync(false).then(r=>{
      if(r.err){toast('⚠️ Hevy: '+r.err);if(tab==='train')render();return}
      if(r.changed&&['home','train','data'].includes(tab))render();
      if(firstHv)toast('✓ Treinos e histórico agora vêm do Hevy — '+r.shown+' rotina(s)');
      else if(r.n)toast('✓ '+r.n+' treino(s) novo(s) do Hevy');
    });
  }
  if(memOnly)toast('⚠️ Sem armazenamento — dados só nesta sessão');
}
async function saveProgram(){await sSet(K_PROG,program)}
async function saveHistory(){await sSet(K_HIST,history)}

/* ============ cloud sync (GitHub Gist) ============ */
const GIST_FILE='progressao-treino.json';
const ghHeaders=()=>({'Authorization':'Bearer '+ghToken,'Accept':'application/vnd.github+json','Content-Type':'application/json'});
async function cloudPull(){
  try{
    const r=await fetch('https://api.github.com/gists/'+gistId,{headers:ghHeaders()});
    if(r.status===404){
      gistId='';await sSet(K_GIST,'');
      syncState='☁️ Gist não existe mais — um novo será criado no próximo salvamento';
      return;
    }
    if(!r.ok)throw new Error('HTTP '+r.status);
    const g=await r.json();
    const f=g.files&&g.files[GIST_FILE];
    if(!f)throw new Error('arquivo não encontrado no gist');
    let content=f.content;
    if(f.truncated){const rr=await fetch(f.raw_url);content=await rr.text()}
    const data=JSON.parse(content);
    await pullSecrets(data);
    if((data.updatedAt||0)>(updatedAt||0)){
      if(Array.isArray(data.program))program=data.program;
      if(Array.isArray(data.history))history=data.history;
      if(data.diet&&data.diet.entries){diet.entries=data.diet.entries;diet.settings=sanitizeSettings(Object.assign(diet.settings,data.diet.settings||{}))}
      updatedAt=data.updatedAt||Date.now();
      await sSet(K_PROG,program);await sSet(K_HIST,history);await sSet(K_DIET,diet);await sSet(K_UPD,updatedAt);
      syncState='☁️ Baixado da nuvem — '+new Date(updatedAt).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
    }else{
      syncState='☁️ Local já está atualizado';
    }
  }catch(e){syncState='⚠️ Falha ao baixar: '+(e.message||'rede')}
}
async function cloudPush(){
  if(!ghToken)return;
  try{
    const payload={description:'Progressão de treino — dados (auto-sync)',public:false,files:{}};
    const secrets=await sealSecrets();
    payload.files[GIST_FILE]={content:JSON.stringify({program,history,diet,updatedAt,...(secrets?{secrets}:{})})};
    let r;
    if(gistId){
      r=await fetch('https://api.github.com/gists/'+gistId,{method:'PATCH',headers:ghHeaders(),body:JSON.stringify(payload)});
      if(r.status===404){gistId='';await sSet(K_GIST,'')}
    }
    if(!gistId){
      r=await fetch('https://api.github.com/gists',{method:'POST',headers:ghHeaders(),body:JSON.stringify(payload)});
      if(r.ok){const g=await r.json();gistId=g.id;await sSet(K_GIST,gistId)}
    }
    if(!r.ok)throw new Error('HTTP '+r.status);
    syncState='☁️ Sincronizado às '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  }catch(e){syncState='⚠️ Falha ao enviar: '+(e.message||'rede');toast('⚠️ Sync falhou — dados salvos localmente')}
}
async function findGist(){
  try{
    const r=await fetch('https://api.github.com/gists?per_page=100',{headers:ghHeaders()});
    if(!r.ok)return;
    const list=await r.json();
    const hit=list.find(g=>g.files&&g.files[GIST_FILE]);
    if(hit){gistId=hit.id;await sSet(K_GIST,gistId)}
  }catch(e){}
}
async function touchAndPush(){
  updatedAt=Date.now();
  await sSet(K_UPD,updatedAt);
  if(ghToken)cloudPush();
}
/* ---- chaves do Hevy e do Gemini na nuvem ----
   Vão para o Gist criptografadas (AES-GCM) com uma chave derivada do token do GitHub: num aparelho novo
   basta colar o token. Quem tiver só o link do Gist não consegue ler as chaves. Cada chave leva a hora em
   que foi salva, para a mais nova valer em todos os aparelhos (inclusive quando você troca ou remove uma). */
const K_KEYAT='ul_keysat_v1';
let keysAt={hevy:0,gemini:0}, remoteSecrets=null, remoteSecretVals=null, secretsNote='', secretsNeedPush=false;
let _secKey=null,_secKeyTok='';
const b64=buf=>btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64=str=>Uint8Array.from(atob(str),c=>c.charCodeAt(0));
async function secretsKey(){
  if(!ghToken||!(window.crypto&&crypto.subtle))return null;
  if(_secKey&&_secKeyTok===ghToken)return _secKey;
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(ghToken),'PBKDF2',false,['deriveKey']);
  _secKey=await crypto.subtle.deriveKey({name:'PBKDF2',salt:new TextEncoder().encode('progressao-treino/chaves/v1'),iterations:100000,hash:'SHA-256'},
    base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
  _secKeyTok=ghToken;
  return _secKey;
}
async function markKey(which){keysAt[which]=Date.now();await sSet(K_KEYAT,keysAt)}
function mergedSecrets(){
  const r=remoteSecretVals||{};
  const o={hevyKey,hevyAt:keysAt.hevy||0,apiKey,apiAt:keysAt.gemini||0,aiModel};
  if((r.hevyAt||0)>o.hevyAt||(!o.hevyKey&&r.hevyKey&&!o.hevyAt)){o.hevyKey=r.hevyKey||'';o.hevyAt=r.hevyAt||0}
  if((r.apiAt||0)>o.apiAt||(!o.apiKey&&r.apiKey&&!o.apiAt)){o.apiKey=r.apiKey||'';o.apiAt=r.apiAt||0;o.aiModel=r.aiModel||aiModel}
  return o;
}
async function sealSecrets(){
  try{
    const k=await secretsKey();
    const v=mergedSecrets();
    if(!k||(!v.hevyKey&&!v.apiKey&&!v.hevyAt&&!v.apiAt))return remoteSecrets; /* nada a enviar: preserva o que já está lá */
    const iv=crypto.getRandomValues(new Uint8Array(12));
    const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},k,new TextEncoder().encode(JSON.stringify(v)));
    return{v:1,iv:b64(iv),ct:b64(ct)};
  }catch(e){return remoteSecrets}
}
async function openSecrets(blob){
  try{
    const k=await secretsKey();
    if(!k||!blob||blob.v!==1)return null;
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(blob.iv)},k,unb64(blob.ct));
    return JSON.parse(new TextDecoder().decode(pt));
  }catch(e){return null} /* cifrado com outro token */
}
/* recebe as chaves da nuvem: adota as mais novas (ou as que faltam neste aparelho) e marca se este aparelho
   tem algo mais novo para enviar */
async function pullSecrets(data){
  remoteSecrets=data.secrets||null;
  const s=data.secrets?await openSecrets(data.secrets):null;
  remoteSecretVals=s;
  const got=[];
  if(s){
    if((s.hevyAt||0)>(keysAt.hevy||0)||(!hevyKey&&s.hevyKey&&!keysAt.hevy)){
      if((s.hevyKey||'')!==hevyKey){hevyKey=s.hevyKey||'';await sSet(K_HEVY,hevyKey);if(hevyKey)got.push('Hevy')}
      keysAt.hevy=s.hevyAt||0;
    }
    if((s.apiAt||0)>(keysAt.gemini||0)||(!apiKey&&s.apiKey&&!keysAt.gemini)){
      if((s.apiKey||'')!==apiKey){apiKey=s.apiKey||'';await sSet(K_KEY,apiKey);if(apiKey)got.push('Gemini')}
      if(s.aiModel&&s.aiModel!==aiModel){aiModel=s.aiModel;await sSet(K_MODEL,aiModel)}
      keysAt.gemini=s.apiAt||0;
    }
    await sSet(K_KEYAT,keysAt);
  }
  secretsNote=got.length?'🔑 Chave'+(got.length>1?'s':'')+' do '+got.join(' e do ')+' recebida'+(got.length>1?'s':'')+' da nuvem':'';
  const r=s||{};
  secretsNeedPush=!!(hevyKey||apiKey)&&(!s||(keysAt.hevy||0)>(r.hevyAt||0)||(keysAt.gemini||0)>(r.apiAt||0)||(!!hevyKey&&!r.hevyKey)||(!!apiKey&&!r.apiKey));
}

/* ============ progression algorithm ============ */
/* Dupla progressão autorregulada (Helms): faixa de reps + RIR alvo. A carga sobe quando as séries planejadas
   dominam a faixa com o esforço da rotina; estagnação compara o desempenho por série (reps e, no empate, RIR).
   Os números (3–4 sessões, recuo de ~10%, 6–8 semanas para deload) são regras práticas do app, não limiares
   validados em estudo — por isso o recuo de carga só vem depois de queda ou de estagnação confirmada. */
/* mesmo exercício do Hevy em treinos com faixa, RIR ou número de séries diferentes (ex.: puxada 3×6-8 num dia e
   4×10-12 no outro) → cada treino usa só o próprio histórico; com o mesmo alvo, o histórico é compartilhado */
function exScope(ex,wo){
  if(!wo)return null;
  for(const w2 of program)if(w2!==wo&&w2.exercises.some(e=>e.id===ex.id&&(e.repMin!==ex.repMin||e.repMax!==ex.repMax||e.rirMin!==ex.rirMin||e.rirMax!==ex.rirMax||e.sets!==ex.sets)))return wo;
  return null;
}
function lastEntries(exId,n,wo){
  const out=[];
  for(let i=history.length-1;i>=0&&out.length<n;i--){
    /* com escopo: sessões deste treino (pela rotina do Hevy ou, nas antigas, pelo nome do treino) */
    if(wo&&history[i].workoutId!==wo.id&&history[i].workoutName!==wo.name)continue;
    const e=history[i].entries.find(x=>x.exId===exId);
    if(e&&e.sets.some(s=>s.w!=null||s.r!=null))out.push({date:history[i].date,sets:e.sets});
  }
  return out;
}
/* séries de trabalho de uma sessão: fora aquecimento e drop-set (tipos do Hevy). A carga de referência é a mais
   pesada delas — back-offs e séries mais leves ficam fora da decisão e só aparecem contadas */
function workSets(sets){
  const all=(sets||[]).filter(s=>s&&s.r!=null&&s.r!=='');
  const work=all.filter(s=>s.t!=='dropset'&&s.t!=='warmup');
  if(!work.length)return{weight:null,sets:[],extra:all.length};
  const wOf=s=>(s.w!=null&&s.w!=='')?+s.w:0;
  const ref=Math.max(...work.map(wOf));
  const at=work.filter(s=>wOf(s)===ref);
  return{weight:ref,sets:at,extra:all.length-at.length,lighter:work.length-at.length};
}
/* RIR registrado; série marcada como falha no Hevy e sem RPE conta como RIR 0 */
const rirOf=s=>(s.rir!=null&&s.rir!=='')?+s.rir:(s.t==='failure'?0:null);
/* carga já usada neste exercício (existe no seu equipamento) */
function usedLoads(exId){
  const out=new Set();
  for(const h of history){const e=h.entries.find(x=>x.exId===exId);if(e)for(const st of e.sets)if(st&&st.w!=null&&st.w!==''&&+st.w>0&&st.t!=='warmup')out.add(+st.w)}
  return[...out];
}
/* alvo da decisão, a partir das séries planejadas na rotina do Hevy. Com cargas diferentes por série (top set +
   back-offs), decide pelo grupo mais pesado, com a faixa e o RIR dele — os back-offs acompanham */
function progTarget(ex){
  const T={k:Math.max(1,ex.sets||1),lo:ex.repMin,hi:ex.repMax,rirMin:ex.rirMin,rirMax:ex.rirMax,multi:false,topW:ex.planW||null,rirSet:null};
  const pl=Array.isArray(ex.plan)?ex.plan:null;
  let grp=pl;
  if(pl&&pl.length>1){
    const ws=pl.map(p=>p.w);
    if(ws.every(w=>w!=null&&w>0)&&new Set(ws).size>1){
      const top=Math.max(...ws), g=pl.filter(p=>p.w===top);
      grp=g;T.k=g.length;T.multi=true;T.topW=top;
      const lo=g.map(p=>p.lo).filter(v=>v!=null), hi=g.map(p=>p.hi).filter(v=>v!=null);
      if(lo.length)T.lo=Math.min(...lo);
      if(hi.length)T.hi=Math.max(T.lo,...hi);
      const rp=g.map(p=>p.rpe).filter(v=>v!=null&&v>0);
      if(rp.length){T.rirMin=Math.max(0,10-Math.max(...rp));T.rirMax=Math.max(0,10-Math.min(...rp))}
    }
  }
  /* RPE planejado série a série (ex.: 7/8/9): cada série é conferida com o próprio alvo, na ordem */
  if(grp&&grp.length===T.k&&grp.some(p=>p.rpe!=null)){
    const rs=grp.map(p=>p.rpe!=null?Math.max(0,10-p.rpe):null);
    if(new Set(rs.filter(v=>v!=null)).size>1)T.rirSet=rs.map(v=>v??T.rirMin);
  }
  return T;
}
function refAnalysis(sets,ex){
  const T=progTarget(ex), W=workSets(sets);
  if(W.weight==null)return null;
  const ev=W.sets, n=ev.length, complete=n>=T.k;
  const evk=complete?ev.slice(0,T.k):ev; /* séries a mais na mesma carga não atrapalham: valem as planejadas */
  const reps=evk.map(s=>+s.r);
  const rirA=evk.map(rirOf), rirK=rirA.filter(v=>v!=null);
  const flex=diet.settings.progMode==='flexivel';
  /* flexível: todas as séries dentro da faixa e o total (cada série contada até o topo) a 1 do máximo —
     reps além do topo não compensam uma série curta */
  const repsTop=complete&&(flex
    ?reps.every(r=>r>=T.lo)&&reps.reduce((a,r)=>a+Math.min(r,T.hi),0)>=T.k*T.hi-1
    :reps.every(r=>r>=T.hi));
  const tgt=i=>T.rirSet&&T.rirSet[i]!=null?T.rirSet[i]:T.rirMin;
  const rirOk=rirA.every((v,i)=>v==null||v>=tgt(i));
  const mean=a=>a.reduce((x,y)=>x+y,0)/a.length;
  return{
    ref:W.weight,n,k:T.k,T,complete,
    total:reps.reduce((a,b)=>a+b,0),
    meanR:mean(reps),meanRIR:rirK.length===evk.length?mean(rirK):null,
    top:repsTop&&rirOk,rirLow:repsTop&&!rirOk,
    effortUnknown:rirK.length===0,effortPartial:rirK.length>0&&rirK.length<evk.length,known:rirK.length,
    lighter:W.lighter,
    anyBelow:reps.some(r=>r<T.lo),
    ground:evk.some((s,i)=>+s.r<T.lo&&rirA[i]===0)
  };
}
/* a sessão a rendeu mais que b? mais reps por série ou, com as mesmas reps, mais RIR sobrando */
function perfBetter(a,b){
  if(a.meanR>b.meanR+0.01)return true;
  if(Math.abs(a.meanR-b.meanR)<=0.01&&a.meanRIR!=null&&b.meanRIR!=null)return a.meanRIR>b.meanRIR+0.01;
  return false;
}
/* sessões seguidas na mesma carga de referência, sem bater o alvo (a mais recente primeiro) */
function sameLoadRun(prev,ex,A){
  const run=[A];
  for(let i=1;i<prev.length;i++){
    const P=refAnalysis(prev[i].sets,ex);
    if(!P||P.ref!==A.ref||P.top)break;
    if(P.complete)run.push(P); /* sessão incompleta não entra na comparação: média de menos séries não é comparável */
  }
  return run;
}
/* queda = 3 sessões seguidas piorando · longa = 4 sessões sem superar a mais antiga · possível = 3 sem evolução */
function stallInfo(run){
  if(run.length<3)return null;
  const[a,b,c]=run;
  if(perfBetter(b,a)&&perfBetter(c,b))return{kind:'queda',n:3};
  if(perfBetter(a,c)||perfBetter(b,c))return null;
  if(run.length>=4&&![a,b,c].some(x=>perfBetter(x,run[3])))return{kind:'longa',n:4};
  return{kind:'possivel',n:3};
}
function suggest(ex,wo){
  const prev=lastEntries(ex.id,6,exScope(ex,wo));
  const T=progTarget(ex);
  const firstMsg=T.topW
    ?{type:'first',w:T.topW,label:'PRIMEIRA SESSÃO',msg:`Comece com a carga da rotina do Hevy e busque ${fmtR(T.lo,T.hi)} reps com RIR ${fmtR(T.rirMin,T.rirMax)}.`}
    :{type:'first',w:null,label:'PRIMEIRA SESSÃO',msg:`Escolha uma carga que dê ${fmtR(T.lo,T.hi)} reps com RIR ${fmtR(T.rirMin,T.rirMax)}.`};
  if(!prev.length)return firstMsg;
  const A=refAnalysis(prev[0].sets,ex);
  if(!A)return firstMsg;
  const w=A.ref, bw=w===0; /* sem carga registrada = peso corporal (ex.: elevação de pernas no Hevy) */
  const run=sameLoadRun(prev,ex,A), st=A.top||!A.complete?null:stallInfo(run); /* estagnação só com sessões completas */
  const trail=st?' ('+run.slice(0,st.n).reverse().map(P=>fmt(Math.round(P.meanR*10)/10)).join(' → ')+' reps/série)':'';
  const effort=A.effortUnknown?' <i>Esforço não informado</i>: sem RPE registrado no Hevy, o app não confere o RIR.'
    :A.effortPartial?` <i>Esforço conferido só em ${A.known} de ${A.k} séries</i> — as outras estão sem RPE no Hevy.`:'';
  const rirTgt=T.rirSet?'RIR '+T.rirSet.map(fmt).join('/')+' (série a série)':'RIR '+fmtR(T.rirMin,T.rirMax);
  const boNote=T.multi&&A.lighter<ex.sets-T.k?` Back-offs registrados: ${A.lighter} de ${ex.sets-T.k} — a decisão vale pela série pesada, mas o volume planejado ficou incompleto.`:'';
  const goal=diet.settings.progMode==='flexivel'?'todas as séries ficarem na faixa e o total chegar a 1 do máximo':'todas as séries baterem '+fmt(T.hi);
  const rirTxt=rirTgt;
  if(bw){
    if(A.top)return{type:'up',w:null,label:'PROGRIDE',msg:'Faixa dominada com peso corporal — acrescente carga (anilha/colete) ou use uma variação mais difícil.'+effort};
    if(A.rirLow)return{type:'hold',w:null,label:'SEGURA — RIR BAIXO',msg:`Bateu o topo, mas mais perto da falha que o alvo (${rirTxt}). Repita até fechar o topo com esse RIR.`};
    if(A.ground)return{type:'hold',w:null,label:'SEGURA',msg:'Reps abaixo da faixa com RIR 0 — use uma variação mais fácil até dominar a faixa.'};
    if(!A.complete)return{type:'hold',w:null,label:'SESSÃO INCOMPLETA',msg:`Só ${A.n} de ${A.k} séries na última sessão — complete as ${A.k} antes de progredir. Sessões incompletas não contam para estagnação.`};
    if(st)return{type:st.kind==='possivel'?'hold':'stall',w:null,label:st.kind==='possivel'?'POSSÍVEL ESTAGNAÇÃO':(st.kind==='queda'?'QUEDA DE DESEMPENHO':'ESTAGNOU'),msg:`${st.n} sessões ${st.kind==='queda'?'seguidas caindo':'sem evolução'}${trail}. Desacelere a descida, acrescente carga ou troque a variação.`};
    if(!A.complete)return{type:'hold',w:null,label:'SESSÃO INCOMPLETA',msg:`Só ${A.n} de ${A.k} séries na última sessão — complete as ${A.k} antes de progredir.`};
    return{type:'keep',w:null,label:'MANTÉM — BUSCA REPS',msg:`Some reps até ${goal}.`};
  }
  const inc=incFor(ex,wo);
  if(A.top&&inc>0){
    const nw=round25(w+inc), big=inc/w>0.15;
    return{type:'up',w:nw,label:'SOBE CARGA',msg:`Faixa dominada ${A.k===1?'na série'+(T.multi?' pesada':''):'nas '+A.k+' séries'+(T.multi?' pesadas':'')} com ${fmt(w)} kg → sobe para ${fmt(nw)} kg.`
      +(T.multi?' Os back-offs acompanham a série pesada.':'')
      +(big?` Degrau grande para essa carga (+${Math.round(inc/w*100)}%): se as reps despencarem, use microanilhas ou mude o incremento (toque em +${fmt(inc)} kg).`:'')+effort+boNote};
  }
  if(A.top)return{type:'up',w,label:'PROGRIDE',msg:'Faixa dominada — adicione 1 rep acima do topo ou reduza o RIR.'+effort+boNote};
  if(A.rirLow)return{type:'hold',w,label:'SEGURA — RIR BAIXO',msg:`Bateu o topo (${fmt(T.hi)} reps), mas mais perto da falha que o alvo (${rirTxt}). Mantenha ${fmt(w)} kg até fechar o topo com esse RIR.`};
  if(!A.complete){
    if(A.ground)return{type:'hold',w:round25(Math.max(0,w-inc)),label:'SEGURA / REDUZ',msg:`Reps abaixo da faixa com RIR 0 → recue ${fmt(inc)} kg e domine a faixa.`};
    return{type:'hold',w,label:'SESSÃO INCOMPLETA',msg:`Só ${A.n} de ${A.k} séries com ${fmt(w)} kg na última sessão — mantenha ${fmt(w)} kg e complete as ${A.k} na faixa antes de subir. Sessões incompletas não contam para estagnação.`};
  }
  if(st&&st.kind!=='possivel'){
    const d=backoffW(w,inc,usedLoads(ex.id)), queda=st.kind==='queda';
    const why=queda?`3 sessões seguidas caindo com ${fmt(w)} kg${trail} — sinal de fadiga.`:`4 sessões com ${fmt(w)} kg sem evolução${trail}.`;
    const what=d!=null?`Recue para ${fmt(d)} kg (~${Math.round((1-d/w)*100)}%) e reconstrua`:`O degrau de carga (+${fmt(inc)} kg) é grande demais para recuar ~10%: mantenha ${fmt(w)} kg com 1 série a menos nesta semana`;
    return{type:'stall',w:d??w,label:queda?'QUEDA DE DESEMPENHO':'ESTAGNOU — MICRODELOAD',msg:`${why} ${what}${queda?'; confira sono, déficit calórico e volume da semana.':', ou troque a variação do exercício.'}`};
  }
  if(A.ground)return{type:'hold',w:round25(Math.max(0,w-inc)),label:'SEGURA / REDUZ',msg:`Reps abaixo da faixa com RIR 0 → recue ${fmt(inc)} kg e domine a faixa.`};
  if(st)return{type:'hold',w,label:'POSSÍVEL ESTAGNAÇÃO',msg:`3 sessões com ${fmt(w)} kg sem evolução${trail}. Mantenha a carga; se a próxima também não evoluir, o app sugere recuar ~10%. Sono, déficit e descanso entre séries pesam aqui.`};
  if(!A.complete)return{type:'hold',w,label:'SESSÃO INCOMPLETA',msg:`Só ${A.n} de ${A.k} séries com ${fmt(w)} kg na última sessão — mantenha ${fmt(w)} kg e complete as ${A.k} na faixa antes de subir.`};
  if(A.anyBelow)return{type:'hold',w,label:'SEGURA CARGA',msg:'Série de trabalho abaixo da faixa — mantenha o peso até entrar na faixa completa.'};
  const growing=run.length>=2&&perfBetter(run[0],run[1]);
  return{type:'keep',w,label:'MANTÉM — BUSCA REPS',msg:`Mantenha ${fmt(w)} kg e some reps até ${goal}.${growing?' Melhor que a sessão anterior — no caminho certo.':''}`};
}
/* semanas com treino desde o último deload marcado ou desde a última pausa de 7+ dias (pausa também descansa) */
function deloadInfo(){
  const ts=history.map(h=>new Date(h.date).getTime()).filter(t=>!isNaN(t)).sort((a,b)=>a-b);
  if(!ts.length)return null;
  const WK=7*864e5;
  if(Date.now()-ts[ts.length-1]>=WK)return{weeks:0,pause:true};
  let start=ts[0];
  const ld=diet.settings.lastDeload?new Date(diet.settings.lastDeload+'T12:00:00').getTime():null;
  if(ld&&ld>start)start=ld;
  for(let i=1;i<ts.length;i++)if(ts[i]-ts[i-1]>=WK&&ts[i]>start)start=ts[i];
  const wk=t=>{const d=new Date(t);d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d.getTime()};
  return{weeks:new Set(ts.filter(t=>t>=start).map(wk)).size,since:start,pause:false};
}
/* aviso de deload: pelo desempenho (exercícios caindo/estagnados) depois de 6+ semanas; com 8+ semanas, só lembrete */
function deloadBanner(){
  const dl=deloadInfo();
  if(!dl||dl.pause||dl.weeks<6)return null;
  const strong=new Set(), weak=new Set();
  for(const w of program)for(const ex of w.exercises){const s=suggest(ex,w);if(s.type==='stall')strong.add(ex.id);else if(s.label==='POSSÍVEL ESTAGNAÇÃO')weak.add(ex.id)}
  const n=new Set([...strong,...weak]).size;
  if(strong.size||n>=2)return{kind:'sugerido',weeks:dl.weeks,n};
  if(dl.weeks>=8)return{kind:'lembrete',weeks:dl.weeks,n};
  return null;
}
const round25=v=>Math.round(v/0.25)*0.25;
/* recuo de ~10%: de preferência uma carga que você já usou neste exercício (existe no equipamento); senão, degraus
   a partir da carga atual (carga − n × incremento) — não múltiplos a partir de zero. null se não houver recuo razoável */
function backoffW(w,inc,used){
  const lo=w*0.75, target=w*0.9;
  const c=(used||[]).filter(x=>x<w&&x>=lo);
  if(c.length)return c.reduce((a,b)=>Math.abs(b-target)<Math.abs(a-target)?b:a);
  const st=inc>0?inc:2.5, n=Math.max(1,Math.round(w*0.1/st)), d=round25(w-n*st);
  return d>=lo&&d>0?d:null;
}
const fmt=v=>(+v).toLocaleString('pt-BR',{maximumFractionDigits:2});
const fmtR=(a,b)=>fmt(a)+(b!=null&&+b!==+a?'–'+fmt(b):''); /* faixa: "8–10", "1,5–2" ou "2" */
/* incremento de carga: o que você definir no app vale primeiro. No automático, o app usa o salto que você costuma
   dar ao progredir neste exercício: só aumentos para uma carga nova (acima das 3 sessões anteriores), no mesmo
   contexto (mesma rotina quando as faixas diferem) e repetidos pelo menos 2 vezes. É um salto observado — não
   prova o menor degrau do aparelho; para isso, defina o incremento à mão. Sem esse padrão, um valor padrão */
function incInfo(ex,auto,wo){
  const ov=!auto&&diet.settings.incOverride?+diet.settings.incOverride[ex.id]:0;
  if(ov>0)return{v:ov,src:'definido'};
  const sc=wo?exScope(ex,wo):null, ws=[];
  for(const h of history){
    if(sc&&h.workoutId!==sc.id&&h.workoutName!==sc.name)continue;
    const e=h.entries.find(x=>x.exId===ex.id);
    if(e){const r=workSets(e.sets);if(r.weight)ws.push(r.weight)}
  }
  const cnt={};
  for(let i=1;i<ws.length;i++){
    const prevMax=Math.max(...ws.slice(Math.max(0,i-3),i)), d=round25(ws[i]-prevMax);
    if(d>=0.5&&d<=10)cnt[d]=(cnt[d]||0)+1;
  }
  let best=null,bc=0;
  for(const k in cnt)if(cnt[k]>bc||(cnt[k]===bc&&+k<best)){bc=cnt[k];best=+k}
  if(best&&bc>=2)return{v:best,src:'seus aumentos'};
  if(/dumbbell|halter/i.test(ex.name))return{v:2,src:'padrão'};
  return{v:ex.inc>0?ex.inc:(ex.repMin<=8?2.5:1.25),src:'padrão'};
}
const incFor=(ex,wo)=>incInfo(ex,false,wo).v;
const INC_STEPS=[0.5,1,1.25,2,2.5,4,5];

function dISO(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function sessionsByDay(){const m={};for(const s of history){const k=dISO(new Date(s.date));(m[k]=m[k]||[]).push(s)}return m}
function weightStreak(){
  let n=0, d=new Date();
  const has=k=>{const e=diet.entries[k];return e&&e.weight!=null&&e.weight!==''};
  if(!has(dISO(d)))d.setDate(d.getDate()-1); /* hoje ainda não pesou não quebra a sequência */
  while(has(dISO(d))){n++;d.setDate(d.getDate()-1)}
  return n;
}
function trainWeekStreak(sbd){
  /* semanas consecutivas (terminando na atual ou anterior) com 3+ treinos */
  const mon=d=>{const m=new Date(d);m.setDate(m.getDate()-((m.getDay()+6)%7));m.setHours(0,0,0,0);return m};
  const cnt=ws=>{const we=new Date(ws.getTime()+6048e5);return history.filter(h=>{const t=new Date(h.date);return t>=ws&&t<we}).length};
  let w=mon(new Date()), n=0;
  if(cnt(w)>=3){n++;}
  w=new Date(w.getTime()-6048e5);
  while(cnt(w)>=3){n++;w=new Date(w.getTime()-6048e5)}
  return n;
}

function drawTonnage(){
  const cv=document.getElementById('tonchart');if(!cv)return;
  const dpr=window.devicePixelRatio||1, W=cv.clientWidth, H=150;
  cv.width=W*dpr;cv.height=H*dpr;
  const ctx=cv.getContext('2d');ctx.scale(dpr,dpr);
  ctx.font='10px ui-monospace,monospace';
  const now=new Date();
  const mon=new Date(now);mon.setDate(now.getDate()-((now.getDay()+6)%7));mon.setHours(0,0,0,0);
  const weeks=[];
  for(let i=7;i>=0;i--){
    const ws=new Date(mon.getTime()-i*6048e5), we=new Date(ws.getTime()+6048e5);
    let ton=0;
    for(const s of history){const t=new Date(s.date);if(t>=ws&&t<we)for(const e of s.entries)for(const st of e.sets)if(st.r!=null&&st.w!=null)ton+=st.w*st.r}
    weeks.push({label:String(ws.getDate()).padStart(2,'0')+'/'+String(ws.getMonth()+1).padStart(2,'0'),ton});
  }
  const mx=Math.max(...weeks.map(w=>w.ton),1);
  if(mx<=1){ctx.fillStyle='#5c636c';ctx.font='13px sans-serif';ctx.fillText('Registre treinos para ver o volume',20,75);return}
  const bw=(W-20)/8;
  weeks.forEach((w,i)=>{
    const h=(w.ton/mx)*(H-42);
    const x=10+i*bw+bw*0.15, y=H-24-h;
    ctx.fillStyle=i===7?'#f5a623':'#6b5316';
    ctx.beginPath();ctx.roundRect(x,y,bw*0.7,h,4);ctx.fill();
    ctx.fillStyle='#8b929b';
    if(w.ton>0){const lbl=w.ton>=1000?(w.ton/1000).toFixed(1)+'t':Math.round(w.ton)+'';ctx.fillText(lbl,x+bw*0.35-ctx.measureText(lbl).width/2,y-5)}
    ctx.fillStyle='#5c636c';
    ctx.fillText(w.label,x+bw*0.35-ctx.measureText(w.label).width/2,H-8);
  });
}

/* ============ CSV (pt-BR Excel) ============ */
function exportCSV(){
  let rows=['sep=;','Data;Hora;Treino;Exercício;Série;Carga (kg);Reps;RIR'];
  for(const s of history){
    const d=new Date(s.date);
    const ds=d.toLocaleDateString('pt-BR'),ts=d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
    for(const e of s.entries)e.sets.forEach((st,i)=>{
      if(st.r==null&&st.w==null)return;
      rows.push([ds,ts,s.workoutName,e.exName,i+1,st.w!=null?String(st.w).replace('.',','):'',st.r??'',st.rir??''].map(csvq).join(';'));
    });
  }
  download('historico-treinos.csv','\uFEFF'+rows.join('\r\n'),'text/csv;charset=utf-8');
  toast('✓ CSV exportado');
}
const csvq=v=>{v=String(v);return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
function parseCSVLine(line){
  const out=[];let cur='',q=false;
  for(let i=0;i<line.length;i++){const c=line[i];
    if(q){if(c==='"'){if(line[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}
    else if(c==='"')q=true;
    else if(c===';'){out.push(cur);cur=''}
    else cur+=c;
  }
  out.push(cur);return out;
}
async function importCSV(ev){
  const f=ev.target.files[0];if(!f)return;
  const text=(await f.text()).replace(/^\uFEFF/,'');
  const lines=text.split(/\r?\n/).filter(l=>l.trim()&&!/^sep=/.test(l)&&!/^Data;/.test(l));
  const sessions={};let n=0,bad=0;
  for(const line of lines){
    const [ds,ts,wn,en,si,w,r,rir]=parseCSVLine(line);
    if(!ds||!en)continue;
    const [dd,mm,yy]=ds.split('/');
    const dt=new Date(`${yy}-${String(mm).padStart(2,'0')}-${String(dd).padStart(2,'0')}T${(ts||'12:00')}:00`);
    const wv=w?numBR(w):null, rv=r?numBR(r):null, iv=rir!=null&&rir!==''?numBR(rir):null;
    if(!/^\d{4}$/.test(yy||'')||isNaN(dt)||(wv!=null&&!inRange(wv,0,1000))||(rv!=null&&!inRange(rv,0,200))||(iv!=null&&!inRange(iv,0,10))){bad++;continue}
    const iso=dt.toISOString();
    const key=ds+'|'+wn;
    if(!sessions[key]){
      const wo=program.find(x=>x.name===wn);
      sessions[key]={id:uid(),date:iso,workoutId:wo?wo.id:'imported',workoutName:wn,entries:[]};
    }
    const sess=sessions[key];
    let entry=sess.entries.find(e=>e.exName===en);
    if(!entry){
      let exId='imp_'+en;
      for(const wo of program){const m=wo.exercises.find(e=>e.name===en);if(m){exId=m.id;break}}
      entry={exId,exName:en,sets:[]};sess.entries.push(entry);
    }
    entry.sets[(+si||entry.sets.length+1)-1]={w:wv,r:rv,rir:iv};
    n++;
  }
  for(const key in sessions){
    const s=sessions[key];
    history=history.filter(h=>!(new Date(h.date).toLocaleDateString('pt-BR')+'|'+h.workoutName===key));
    history.push(s);
  }
  history.sort((a,b)=>new Date(a.date)-new Date(b.date));
  await saveHistory();await touchAndPush();ev.target.value='';
  render();toast(`✓ ${n} séries importadas`+(bad?` · ${bad} linha(s) inválida(s) ignorada(s)`:''));
}

/* ============ JSON backup ============ */
function exportJSON(){
  download('backup-progressao.json',JSON.stringify({program,history,diet,exported:new Date().toISOString()},null,1),'application/json');
  toast('✓ Backup exportado');
}
async function importJSON(ev){
  const f=ev.target.files[0];if(!f)return;
  try{
    const data=JSON.parse(await f.text());
    if(!Array.isArray(data.program)||!Array.isArray(data.history))throw 0;
    const hs=data.history.filter(h=>h&&Array.isArray(h.entries)&&!isNaN(new Date(h.date)));
    let bad=data.history.length-hs.length;
    program=data.program;history=hs;
    if(data.diet&&data.diet.entries){const c=cleanDietEntries(data.diet.entries);bad+=c.bad;diet.entries=c.entries;const ns=data.diet.settings&&typeof data.diet.settings==='object'?data.diet.settings:{};diet.settings=sanitizeSettings(Object.assign(diet.settings,ns));restoreWeek();await saveDiet()}
    await saveProgram();await saveHistory();await touchAndPush();
    selWorkout=program[0]?.id;ev.target.value='';
    render();toast('✓ Backup restaurado'+(bad?' · '+bad+' registro(s) inválido(s) ignorado(s)':''));
  }catch(e){toast('Arquivo inválido')}
}
function download(name,content,type){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([content],{type}));
  a.download=name;a.click();URL.revokeObjectURL(a.href);
}

function normalizeGeminiModel(model){

function geminiGenConfig(model){

function aiProfileLine(){
  const p=diet.settings.profile||{}, b=[];
  if(p.sex)b.push(p.sex==='f'?'mulher':'homem');
  if(p.age)b.push(fmt(p.age)+' anos');
  if(p.h)b.push(fmt(p.h/100)+' m');
  const tr=computeTrend(), td=Object.keys(tr).sort();
  if(td.length)b.push('peso-tendência atual ~'+fmt(tr[td[td.length-1]].toFixed(1))+' kg');
  else if(p.w)b.push('peso informado na calculadora '+fmt(p.w)+' kg'+(p.at?' (em '+p.at.split('-').reverse().join('/')+')':''));
  else b.push('peso ainda não registrado');
  if(p.bf!=null)b.push('~'+fmt(p.bf)+'% de gordura ('+(p.bfExam?'exame':'estimativa')+(p.at?' de '+p.at.split('-').reverse().join('/'):'')+')');
  return 'Perfil do atleta (do app): '+b.join(', ')+'.';
}
function buildContext(){
  const lines=[];
  /* perfil montado das configurações atuais (calculadora da Dieta, peso-tendência, modo de progressão) + o texto
     "Sobre você" da aba IA — nada fixo no código */
  lines.push(aiProfileLine());
  lines.push(diet.settings.aiAbout?'Sobre o atleta (texto dele): '+diet.settings.aiAbout:'Descrição padrão do app, ainda não confirmada pelo atleta: '+AI_ABOUT_DEFAULT);
  lines.push(diet.settings.progMode==='flexivel'
    ?'Progressão do app (modo flexível): dupla progressão autorregulada — sobe a carga quando todas as séries planejadas ficam dentro da faixa e o total fica a 1 rep do máximo, com o RIR da rotina.'
    :'Progressão do app (modo conservador): dupla progressão autorregulada — sobe a carga quando todas as séries planejadas batem o topo da faixa com o RIR da rotina.');
  lines.push('Em cada sessão abaixo aparece só a carga de referência (a mais pesada das séries de trabalho) e as séries feitas com ela; aquecimento, drops e back-offs ficam de fora. RIR "F" = série marcada como falha no Hevy, sem RPE (conta como RIR 0).');
  /* programa atual = rotinas com sessões nas últimas 6 semanas (ou recém-criadas no Hevy). Rotinas antigas que
     continuam salvas no Hevy vão só numa linha — detalhadas, a IA as lia como trocas constantes de divisão */
  const now=Date.now(), DAY=864e5, dm=t=>new Date(t).toLocaleDateString('pt-BR');
  const use=program.map(wo=>{
    const ss=history.filter(h=>h.workoutId===wo.id||h.workoutName===wo.name);
    return{wo,n:ss.filter(h=>now-new Date(h.date)<=42*DAY).length,
      last:ss.reduce((a,h)=>Math.max(a,new Date(h.date).getTime()||0),0),
      fresh:!ss.length&&!!wo.created&&now-new Date(wo.created).getTime()<=21*DAY};
  });
  let cur=use.filter(u=>u.n||u.fresh);
  const old=use.filter(u=>!cur.includes(u));
  if(cur.length){
    const perWk=Math.round(history.filter(h=>now-new Date(h.date)<=28*DAY).length/4*10)/10;
    lines.push('\nPrograma atual (rotinas do Hevy com sessões nas últimas 6 semanas): '+cur.map(u=>u.wo.name+' ('+(u.n?u.n+(u.n>1?' sessões':' sessão'):'rotina nova, ainda sem sessões')+')').join(', ')+' — média de '+fmt(perWk)+' sessões/semana nas últimas 4 semanas.');
    if(old.length)lines.push('Rotinas antigas que continuam salvas no Hevy, sem sessões nas últimas 6 semanas (NÃO fazem parte do treino atual): '+old.map(u=>u.wo.name+(u.last?' (última em '+dm(u.last)+')':' (nunca usada)')).join(', ')+'.');
  }else{
    cur=use;
    if(use.length)lines.push('\nNenhuma rotina tem sessões nas últimas 6 semanas. Rotinas salvas no Hevy: '+use.map(u=>u.wo.name).join(', ')+'.');
  }
  for(const{wo}of cur){
    lines.push('\nTreino '+wo.name+':');
    for(const ex of wo.exercises){
      const prev=lastEntries(ex.id,8,exScope(ex,wo)).reverse();
      const hist=prev.map(p=>{
        const d=new Date(p.date).toLocaleDateString('pt-BR').slice(0,5);
        const ref=aiReferenceSets(p.sets);
        if(!ref.sets.length)return d+': sem séries válidas';
        const reps=ref.sets.map(s=>s.r).join('/');
        const rirs=ref.sets.map(s=>s.rir!=null&&s.rir!==''?fmt(s.rir):(s.t==='failure'?'F':null)).filter(v=>v!=null).join('/');
        return d+': '+(ref.weight?fmt(ref.weight)+'kg':'peso corporal')+'×'+reps+' (RIR '+(rirs||'?')+')';
      }).join(' | ');
      const T=progTarget(ex);
      lines.push('- '+ex.name+' [alvo '+(T.multi?T.k+'×'+fmtR(T.lo,T.hi)+' na carga pesada + '+(ex.sets-T.k)+' back-off':ex.sets+'×'+fmtR(ex.repMin,ex.repMax))+' RIR '+(T.rirSet?T.rirSet.map(fmt).join('/')+' série a série':fmtR(T.rirMin,T.rirMax))+(T.topW?', carga na rotina '+fmt(T.topW)+' kg':'')+']: '+(hist||'sem registros ainda'));
    }
  }
  const t=computeTDEE(), wr=weeklyRate(), tr=computeTrend();
  const{tk,W,M:MM}=weekPlan();
  const twd=Object.keys(tr).sort();
  if(twd.length){
    lines.push('\nDieta: peso tendência atual '+tr[twd[twd.length-1]].toFixed(1)+' kg'
      +(wr!=null?' | ritmo '+(wr>0?'+':'')+wr.toFixed(2)+' kg/sem':'')
      +(t.observed!=null?' | gasto estimado ~'+t.tdee+' kcal (dados registrados pesam '+Math.round(t.conf*100)+'% na estimativa, ±'+t.sd+' kcal estatístico; média registrada '+t.avgK+' kcal, kcal em '+t.nK+' de '+t.span+' dias; na régua do registro)':(diet.settings.phase&&diet.settings.phase.prior!==diet.settings.tdee0?' | fase nova: gasto ancorado na fase anterior ~'+t.tdee+' kcal':' | gasto ainda em calibração (estimativa ~'+t.tdee+' kcal'+(t.why==='kcal'?', poucos dias com kcal registradas':'')+')'))
      +(t.stale?' | ATENÇÃO: sem peso+kcal desde '+t.endISO+' ('+t.ageDays+' dias) — números de dieta desatualizados':'')
      +' | objetivo: '+(diet.settings.mode==='fixed'?'meta fixa prescrita pela nutricionista':(diet.settings.mode==='maint'?'manutenção'+(maintInfo().tgt!=null?' com peso-alvo '+maintInfo().tgt+' kg (faixa ±'+MAINT_BAND+' kg; fora dela corrige '+MAINT_PCT+'%/sem; agora '+(maintInfo().inBand?'dentro':'fora')+' da faixa)':''):diet.settings.mode+' '+fmt(ratePct())+'% do peso/sem (~'+rateKg().toFixed(2)+' kg/sem)'))
      +' | metas da semana (check-in semanal de '+W.start+', próximo '+W.next+'; meta '+W.status+'): '+tk.goal+' kcal, P '+MM.prot+'g / C '+MM.carbs+'g / G '+MM.fatG+'g');
  }
  const dates=[...new Set(history.map(h=>new Date(h.date).toLocaleDateString('pt-BR')))];
  lines.push('\nTotal de sessões registradas: '+history.length+(dates.length?' | Últimas datas: '+dates.slice(-12).join(', '):''));
  return lines.join('\n');
}
function geminiHttpError(status,detail,model){
  const err=new Error('HTTP '+status+' — '+detail);
  err.status=status;err.detail=detail;err.model=model;
  return err;
}
/* uma chamada em streaming (streamGenerateContent + SSE): o texto chega em trechos enquanto é escrito,
   então o app mostra a resposta aos poucos e só desiste se o modelo não começar ou travar no meio.
   input = texto do usuário ou a conversa inteira (contents) — a retomada manda o que já foi escrito */
async function geminiGenerate(model,systemText,input,onText){
  const ctl=new AbortController();
  let why=null, idle=null, text='', finish='';
  const arm=(ms,kind)=>{clearTimeout(idle);idle=setTimeout(()=>{why=kind;ctl.abort()},ms)};
  const total=setTimeout(()=>{why='total';ctl.abort()},AI_TOTAL_MS);
  const contents=Array.isArray(input)?input:[{role:'user',parts:[{text:String(input)}]}];
  arm(AI_FIRST_MS,'first');
  try{
    const r=await fetch(GEMINI_BASE+encodeURIComponent(model)+':streamGenerateContent?alt=sse',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-goog-api-key':apiKey},
      cache:'no-store',
      signal:ctl.signal,
      body:JSON.stringify({
        system_instruction:{parts:[{text:systemText}]},
        contents,
        generationConfig:geminiGenConfig(model)
      })
    });
    if(!r.ok){
      const raw=await r.text(); /* lê como texto para não perder a mensagem de erro */
      let data={};
      try{data=raw?JSON.parse(raw):{}}catch(_){}
      if(Array.isArray(data))data=data[0]||{};
      throw geminiHttpError(r.status,data?.error?.message||raw||r.statusText||'erro desconhecido',model);
    }
    const reader=r.body.getReader(), dec=new TextDecoder();
    let buf='';
    const eat=raw=>{
      const line=raw.trim();
      if(!line.startsWith('data:'))return;
      let d;
      try{d=JSON.parse(line.slice(5))}catch(_){return}
      if(d.error)throw geminiHttpError(d.error.code||500,d.error.message||'erro no meio da resposta',model);
      const c=d.candidates?.[0];
      const t=(c?.content?.parts||[]).filter(p=>!p.thought).map(p=>p.text||'').join('');
      if(t){text+=t;arm(AI_IDLE_MS,'idle');if(onText)onText(text,model)}
      if(c?.finishReason)finish=c.finishReason;
      else if(!c&&d.promptFeedback?.blockReason)finish=d.promptFeedback.blockReason;
    };
    for(;;){
      const{value,done}=await reader.read();
      if(done)break;
      buf+=dec.decode(value,{stream:true});
      let nl;
      while((nl=buf.indexOf('\n'))>=0){const line=buf.slice(0,nl);buf=buf.slice(nl+1);eat(line)}
    }
    buf+=dec.decode();
    if(buf.trim())eat(buf); /* último evento sem quebra de linha no fim */
  }catch(e){
    /* se já chegou parte do texto, entrega o que veio (a retomada completa depois) em vez de perder tudo */
    if(text.trim()){
      if(finish)return{text:text.trim(),model,finish,truncated:finish==='MAX_TOKENS',interrupted:false}; /* caiu depois do fim */
      return{text:text.trim(),model,finish:'',truncated:true,interrupted:true,cause:why||(e?.status?'HTTP '+e.status:'rede')};
    }
    if(e?.name==='AbortError'){
      const err=new Error(why==='first'?'Nenhum trecho de resposta em '+(AI_FIRST_MS/1000)+' s.':'Sem resposta em '+(AI_TOTAL_MS/1000)+' s.');
      err.timeout=why||'total';err.model=model;
      throw err;
    }
    /* o Safari devolve só "Load failed" quando a conexão não se completa */
    if(e instanceof TypeError||/load failed|failed to fetch|network request failed|network error/i.test(e?.message||'')){
      const err=new Error('Falha de rede ao acessar a Gemini API ('+(e?.message||'sem detalhe')+').');
      err.network=true;
      throw err;
    }
    throw e;
  }finally{
    clearTimeout(idle);clearTimeout(total);
  }
  text=text.trim();
  if(!text){
    const err=new Error('O Gemini respondeu sem texto (motivo: '+(finish||'desconhecido')+').');
    err.status=200;err.finish=finish;err.model=model;
    throw err;
  }
  /* a API sempre fecha com finishReason (STOP, MAX_TOKENS…) no último trecho: sem ele, o fluxo terminou antes da hora */
  return{text,model,finish,truncated:finish==='MAX_TOKENS',interrupted:!finish};
}
/* tenta o modelo configurado e, se ele não existir mais, estiver sem cota/sobrecarregado ou não começar a responder, os seguintes.
   Chave inválida, permissão e rede não são mascarados: outro modelo não resolveria.
   hooks.models: ordem própria (a retomada começa pelo modelo que estava escrevendo) */
async function geminiGenerateWithFallback(systemText,input,hooks={}){
  const models=hooks.models?[...new Set(hooks.models.map(normalizeGeminiModel))]:geminiModelCandidates();
  let lastError=null, configuredGone=false;
  for(const model of models){
    if(hooks.onModel)hooks.onModel(model);
    try{
      const res=await geminiGenerate(model,systemText,input,hooks.onText);
      /* só grava outro modelo se o configurado deixou de existir; falta de cota e lentidão são passageiras */
      res.persist=configuredGone;
      return res;
    }catch(e){
      lastError=e;
      const msg=String(e?.detail||e?.message||'').toLowerCase();
      const gone=e?.status===404
        ||(e?.status===400&&/model|not found|unsupported|not available|does not exist/.test(msg)&&!/api key/.test(msg))
        ||(e?.status===403&&/model/.test(msg)&&!/api key/.test(msg));
      const busy=e?.status===429||e?.status===500||e?.status===503||e?.status===504||e?.timeout==='first';
      if(gone&&model===normalizeGeminiModel(aiModel))configuredGone=true;
      if(gone||busy)continue;
      throw e;
    }
  }
  throw lastError||new Error('Nenhum modelo Gemini disponível.');
}
async function adoptModel(res){
  if(res.persist&&res.model!==aiModel){aiModel=res.model;await sSet(K_MODEL,aiModel)}
}
function modelNote(before,res){
  if(res.model===before)return '';
  return res.persist
    ?esc(before)+' não está mais disponível — o app passou a usar '+esc(res.model)+'.'
    :esc(before)+' está sem cota, sobrecarregado ou lento agora; esta resposta veio do '+esc(res.model)+' (a configuração foi mantida).';
}
const aiSleep=ms=>new Promise(r=>setTimeout(r,ms));
/* mantém a tela acesa enquanto a IA escreve: com a tela bloqueada o celular derruba a conexão */
async function aiKeepAwake(on){
  try{
    if(on){
      if(!aiWake&&navigator.wakeLock&&document.visibilityState==='visible'){
        const l=await navigator.wakeLock.request('screen');
        aiWake=l;l.addEventListener('release',()=>{if(aiWake===l)aiWake=null});
        if(!aiBusy)aiKeepAwake(false); /* terminou enquanto o pedido estava pendente */
      }
    }else if(aiWake){const l=aiWake;aiWake=null;await l.release()}
  }catch(_){aiWake=null}
}
let aiHiddenAt=0; /* última vez que o app foi para segundo plano com a IA trabalhando */
document.addEventListener('visibilitychange',()=>{
  if(!aiBusy)return;
  if(document.visibilityState==='hidden')aiHiddenAt=Date.now();
  else aiKeepAwake(true); /* o bloqueio de tela cai sozinho quando o app sai da tela */
});
function untilVisible(){
  if(document.visibilityState!=='hidden')return Promise.resolve();
  return new Promise(res=>{const f=()=>{if(document.visibilityState!=='hidden'){document.removeEventListener('visibilitychange',f);res()}};document.addEventListener('visibilitychange',f)});
}
function untilOnline(ms){
  if(navigator.onLine!==false)return Promise.resolve();
  return new Promise(res=>{let t=null;const f=()=>{window.removeEventListener('online',f);clearTimeout(t);res()};t=setTimeout(f,ms);window.addEventListener('online',f)});
}
/* ponto de retomada: fim da última linha ou frase completa — o pedaço cortado é reescrito pela continuação */
function aiResumeBase(text){
  let cut=text.lastIndexOf('\n')+1;
  const re=/[.!?…](?=\s|$)/g;
  let m;
  while((m=re.exec(text)))if(m.index+1>cut)cut=m.index+1;
  return text.slice(0,cut);
}
const aiNorm=l=>l.toLowerCase().replace(/[*_#>`•]/g,'').replace(/^\s*(\d+[.)]|[-+])\s*/,'').replace(/\s+/g,' ').trim();
const aiFlat=s=>s.toLowerCase().replace(/[*_#>`•|]/g,'').replace(/^\s*(\d+[.)]|[-+])\s+/gm,'').replace(/\s+/g,' ').trim();
/* junta o que já estava escrito com a continuação: tira o [FIM] e as linhas que o modelo repetiu no começo.
   final=true quando a continuação terminou de vez */
function aiJoin(base,cont,final){
  let c=String(cont||'').replace(/\s*\[FIM\]\s*$/i,'');
  if(!c.trim()||'[FIM]'.startsWith(c.trim().toUpperCase()))return base;
  /* o modelo recomeçou a resposta do início: vale a versão nova (enquanto escreve, a mais longa das duas) */
  const fb=aiFlat(base), fc=aiFlat(c), L=Math.min(60,fb.length,fc.length);
  if(fc.length<20&&fb.startsWith(fc))return base; /* ainda não dá para saber */
  if(L>=20&&fb.slice(0,L)===fc.slice(0,L))return final||fc.length>=fb.length?c:base;
  const bl=base.split('\n').map(aiNorm).filter(Boolean);
  const seen=new Set([...bl.filter(l=>l.length>=12),...bl.slice(-6)]);
  const lines=c.split('\n');
  let k=0;
  for(let j=0;j<lines.length;j++){if(!lines[j].trim())continue;if(seen.has(aiNorm(lines[j]))){k=j+1;continue}break}
  c=lines.slice(k).join('\n');
  if(!c.trim())return base;
  if(!base||/\n$/.test(base)||/^\s/.test(c))return base+c;
  const block=/^(#{1,6}\s|[-*•+]\s|\d{1,3}[.)]\s|\||([-*_])(\s*\2){2,}\s*$)/.test(c);
  return base+(block?'\n':' ')+c;
}
/* aviso de espera com contador de segundos e o modelo da vez (pinta onde a aba IA estiver aberta) */
function aiWaiting(label){
  const t0=Date.now();
  let model=normalizeGeminiModel(aiModel), on=true;
  const paint=()=>{const el=document.getElementById('aires');if(on&&el)el.innerHTML='<div class="card"><div class="note"><span class="spin"></span>'+esc(label)+' — '+esc(model)+' · '+Math.round((Date.now()-t0)/1000)+' s<br><span style="font-size:12px;color:var(--faint)">Mantenha o app aberto até terminar.</span></div></div>'};
  paint();
  const iv=setInterval(paint,1000);
  return{
    setModel:m=>{model=m;paint()},
    stop:()=>{on=false;clearInterval(iv)},
    secs:()=>Math.round((Date.now()-t0)/1000)
  };
}
function showGeminiError(target,e){
  const st=e?.status||null;
  const raw=e?.detail||e?.message||'erro desconhecido';
  let title='Falha na chamada', hint='';
  if(e?.timeout){title='Tempo esgotado';hint=e.timeout==='first'?'Nenhum dos modelos tentados começou a responder em '+(AI_FIRST_MS/1000)+' s. Costuma ser sobrecarga do lado do Google — tente de novo em alguns minutos.':'A resposta não terminou a tempo. Tente de novo.'}
  else if(e?.network){title='Falha de conexão';hint='A chamada não chegou ao fim. Causas comuns: internet instável, bloqueador de conteúdo/VPN, ou o app ter ido para segundo plano durante a análise (no iPhone isso derruba a conexão). Toque em "Testar conexão": se o teste passar e só a análise falhar, o problema é a duração da resposta, não a chave.'}
  else if(st===400){title='Requisição rejeitada';hint=/api key/i.test(raw)?'A chave não foi aceita — gere uma nova no aistudio.google.com.':'Confira o nome do modelo configurado.'}
  else if(st===401){title='Chave não autorizada';hint='Gere ou confira a chave no aistudio.google.com.'}
  else if(st===403){title='Acesso negado';hint='A chave foi reconhecida, mas não tem permissão (revogada, com restrição de site/API ou projeto bloqueado). Confira no aistudio.google.com.'}
  else if(st===404){title='Modelo não encontrado';hint='Nenhum destes modelos está disponível para a sua chave: '+geminiModelCandidates().join(', ')+'.'}
  else if(st===429){title='Limite do free tier atingido';hint='Todos os modelos tentados estão sem cota agora. As cotas renovam — tente mais tarde.'}
  else if(st>=500){title='Gemini temporariamente indisponível';hint='O servidor do Google está com erro ou sobrecarregado. Tente em alguns minutos.'}
  else if(st===200){title='Resposta vazia';hint=e?.finish==='MAX_TOKENS'?'O raciocínio do modelo consumiu todo o limite de tokens antes do texto.':(/SAFETY|BLOCK|PROHIBITED/i.test(e?.finish||'')?'Resposta bloqueada pelo filtro de segurança do Google.':'')}
  target.innerHTML='<div class="card"><div class="note"><b>'+esc(title)+'</b><br><br><span class="tag">'+esc(String(raw).slice(0,350))+'</span>'+(hint?'<br><br>'+esc(hint):'')+'</div></div>';
}
function aiPaint(){
  const el=document.getElementById('aires'), j=aiJob;
  if(!el||!j||(!j.text&&!j.done))return; /* antes do 1º trecho quem pinta é o aviso de espera */
  const sub=esc(j.model||'')+' · '+(j.done?j.secs+' s':esc(j.status||'escrevendo…'));
  el.innerHTML='<div class="card"><h3>'+esc(j.title)+'</h3><div class="sub">'+sub+'</div>'
    +(j.note?'<p class="note" style="margin-top:6px;font-size:12px">'+j.note+'</p>':'')
    +'<div class="ai-out">'+mdToHtml(j.text)+'</div>'
    +(j.done&&j.stuck?'<p class="note ai-stuck">⚠️ <i>'+esc(j.stuck)+'</i></p><button class="btn ghost" id="aicont" style="margin-top:10px">Continuar de onde parou</button>':'')
    +'</div>';
  const b=document.getElementById('aicont');
  if(b)b.onclick=()=>aiContinue();
}
async function runAI(question){
  const target=document.getElementById('aires');
  if(!apiKey){
    target.innerHTML='<div class="card"><div class="note">Configure primeiro a <b>chave do Gemini</b> na seção abaixo e toque em <b>Testar conexão</b>.</div></div>';
    return;
  }
  if(aiBusy)return;
  const sys='Você é um coach de musculação baseado em evidências (Helms, Israetel, Schoenfeld). Responda em português brasileiro, direto e prático, em no máximo ~300 palavras. Diferencie variação normal de estagnação real. Aponte estagnações, padrões de RIR/fadiga e ações concretas com números quando os dados permitirem. Use **negrito** e listas curtas quando ajudar. Não repita os dados de volta — interprete-os — e não invente nada que não esteja neles. O treino atual é só o das rotinas do "Programa atual"; rotinas antigas aparecem apenas como contexto e não significam que o atleta está trocando de divisão.';
  const user=buildContext()+'\n\n'+(question?('Pergunta do atleta: '+question):'Faça uma análise do progresso: o que evolui, o que estagnou, padrão de RIR e risco de fadiga em déficit, e 2-3 ações concretas para as próximas 2 semanas.');
  const prev=aiJob;
  aiJob={title:question?'Resposta':'Análise do progresso',sys,user,text:'',model:null,before:aiModel,t0:Date.now(),status:'',note:'',stuck:'',done:false};
  const ok=await aiDrive(question?'Perguntando':'Analisando seu histórico');
  if(!ok&&!aiJob.text)aiJob=prev; /* falhou sem texto: ao voltar para a aba, continua aparecendo a última resposta */
}
/* botão "Continuar de onde parou" (quando as retomadas automáticas não bastaram) */
async function aiContinue(){
  const j=aiJob;
  if(aiBusy||!j||!j.stuck)return;
  j.stuck='';j.done=false;j.status='retomando de onde parou…';j.t0=Date.now();
  aiPaint();
  await aiDrive('Retomando');
}
/* gera a resposta do aiJob; se a conexão cair no meio (ou o texto bater no limite de tokens), pede ao modelo
   que continue do ponto onde parou — até AI_AUTO_RESUMES vezes — esperando o app voltar à tela e a internet voltar */
async function aiDrive(label){
  const j=aiJob;
  aiBusy=true;aiKeepAwake(true);
  let w=j.text?null:aiWaiting(label), first=null, resumes=0, retried=false;
  const stopW=()=>{if(w){w.stop();w=null}};
  try{
    for(;;){
      let base=j.text?aiResumeBase(j.text):'';
      if(j.text&&!base.trim()){j.text='';base='';if(!w)w=aiWaiting(label)} /* nada aproveitável: recomeça */
      const input=[{role:'user',parts:[{text:j.user}]}];
      if(base)input.push({role:'model',parts:[{text:base}]},{role:'user',parts:[{text:AI_CONTINUE}]});
      const tA=Date.now();
      let res;
      try{
        res=await geminiGenerateWithFallback(j.sys,input,{
          models:base&&j.model?[j.model,...geminiModelCandidates()]:null,
          onModel:m=>{if(w)w.setModel(m)},
          onText:(txt,m)=>{stopW();j.model=m;j.status='escrevendo…';j.text=base?aiJoin(base,txt):txt;aiPaint()}
        });
      }catch(e){
        if(!base){
          /* caiu antes do 1º trecho porque o app saiu da tela (ou a internet caiu): tenta de novo uma vez ao voltar */
          if(e?.network&&!retried&&(aiHiddenAt>=tA||document.visibilityState==='hidden'||navigator.onLine===false)){
            retried=true;
            await untilVisible();await untilOnline(20000);await aiSleep(800);
            continue;
          }
          throw e;
        }
        res={text:'',model:j.model,finish:'',interrupted:true,err:e}; /* a retomada falhou antes de escrever: o parcial fica */
      }
      stopW();
      if(!first&&!res.err)first=res;
      j.model=res.model||j.model;
      if(res.text)j.text=base?aiJoin(base,res.text,!res.interrupted&&!res.truncated):res.text;
      const odd=!!res.finish&&!/^(STOP|MAX_TOKENS)$/.test(res.finish);
      if(!res.interrupted&&!res.truncated&&!odd){j.stuck='';break}
      if(!odd&&resumes<AI_AUTO_RESUMES){
        resumes++;
        const what=res.interrupted?'conexão caiu':'resposta longa';
        j.status=what+(document.visibilityState==='hidden'?' — retoma quando o app voltar para a tela':' — retomando de onde parou…');
        aiPaint();
        await untilVisible();
        await untilOnline(20000);
        if(res.interrupted)await aiSleep(1200);
        j.status=what+' — retomando de onde parou…';aiPaint();
        continue;
      }
      j.stuck=(odd?'O Google interrompeu a resposta (motivo: '+res.finish+')':res.interrupted?'A conexão caiu no meio da resposta':'A resposta passou do limite de tamanho')
        +(resumes?' e as retomadas automáticas não completaram':'')+' — o texto acima está incompleto.';
      break;
    }
    j.done=true;j.status='';j.secs=Math.round((Date.now()-j.t0)/1000);
    if(first){await adoptModel(first);j.note=modelNote(j.before,first)}
    aiPaint();
    return true;
  }catch(e){
    stopW();
    j.done=true;
    const el=document.getElementById('aires');
    if(el)showGeminiError(el,e);else toast('⚠️ A IA não respondeu — tente de novo na aba IA');
    return false;
  }finally{
    stopW();aiBusy=false;aiKeepAwake(false);
  }
}
/* markdown do Gemini → HTML (linha a linha): títulos, separadores, listas com e sem número (com subníveis),
   tabelas, negrito/itálico e código. O texto é escapado antes — nada do modelo vira HTML de verdade */
function mdToHtml(md){
  const inl=s=>s.replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/__(.+?)__/g,'<b>$1</b>').replace(/(^|[^*\w])\*(?!\s)([^*\n]+?)\*(?!\w)/g,'$1<i>$2</i>');
  const out=[], st=[];
  let para=[], tbl=null;
  const flushP=()=>{if(para.length){out.push('<p>'+para.map(inl).join('<br>')+'</p>');para=[]}};
  const flushT=()=>{if(tbl){out.push('<div class="ai-tbl"><table>'+tbl.map((r,i)=>'<tr>'+r.map(c=>i?'<td>'+inl(c)+'</td>':'<th>'+inl(c)+'</th>').join('')+'</tr>').join('')+'</table></div>');tbl=null}};
  const closeL=()=>{while(st.length)out.push('</li></'+st.pop().tag+'>')};
  for(const raw of esc(String(md||'')).replace(/\r/g,'').split('\n')){
    const line=raw.replace(/\s+$/,'');
    let m;
    if(/^\s*\|.*\|$/.test(line)){
      flushP();closeL();
      const cells=line.trim().slice(1,-1).split('|').map(c=>c.trim());
      if(!cells.every(c=>/^:?-{2,}:?$/.test(c)))(tbl=tbl||[]).push(cells);
      continue;
    }
    flushT();
    if(!line.trim()){flushP();continue}
    if((m=line.match(/^\s*#{1,6}\s+(.*?)\s*#*$/))){flushP();closeL();out.push('<h4>'+inl(m[1])+'</h4>');continue}
    if(/^\s*([-*_])(\s*\1){2,}$/.test(line)){flushP();closeL();out.push('<hr>');continue}
    if((m=line.match(/^(\s*)(?:[-*•+]|(\d{1,3})[.)])\s+(.*)$/))){
      flushP();
      const ind=m[1].replace(/\t/g,'    ').length, tag=m[2]?'ol':'ul';
      while(st.length&&st[st.length-1].ind>ind)out.push('</li></'+st.pop().tag+'>');
      if(st.length&&st[st.length-1].ind===ind&&st[st.length-1].tag!==tag)out.push('</li></'+st.pop().tag+'>');
      if(st.length&&st[st.length-1].ind===ind)out.push('</li><li>');
      else{st.push({tag,ind});out.push('<'+tag+(m[2]&&m[2]!=='1'?' start="'+m[2]+'"':'')+'><li>')}
      out.push(inl(m[3]));
      continue;
    }
    if(st.length&&/^\s/.test(line)){out.push('<br>'+inl(line.trim()));continue} /* continuação do item */
    closeL();
    para.push(line.trim().replace(/^&gt;\s?/,''));
  }
  flushT();flushP();closeL();
  return out.join('');
}

/* ============ diet / adaptive TDEE (inspirado no método adaptativo do MacroFactor, sem equivalência exata) ============ */
const KCAL_PER_KG=7700, EWMA_ALPHA=0.2;

const PRIOR_SD0=300;    /* incerteza da estimativa por fórmula, kcal/dia (equações acertam ±10% em ~80% das pessoas) */
const SETTLE_DAYS=10;   /* dias de uma fase nova com peso reduzido: água, glicogênio e conteúdo intestinal mudam rápido */
const NOISE_AC=1.5;     /* as oscilações de água duram alguns dias: aumenta a incerteza da inclinação (ruído autocorrelacionado) */
const RATE_MAX={deficit:1,surplus:0.5}; /* % do peso por semana — Helms 2014 (déficit 0,5–1%) e Iraki 2019 (ganho 0,25–0,5%) */

const MAINT_PCT=0.15;   /* % do peso/sem: fora da faixa, leve déficit ou superávit para voltar ao peso-alvo */

function computeTrend(){ /* só para o gráfico e o painel; o gasto usa as pesagens do dia */
  const wd=dietDates().filter(d=>diet.entries[d].weight!=null&&diet.entries[d].weight!=='');
  const trend={};
  if(!wd.length)return trend;
  let t=+diet.entries[wd[0]].weight;
  trend[wd[0]]=t;
  for(let i=1;i<wd.length;i++){
    const w0=+diet.entries[wd[i-1]].weight, w1=+diet.entries[wd[i]].weight;
    const gap=Math.max(1,Math.round((new Date(wd[i])-new Date(wd[i-1]))/86400000));
    for(let g=1;g<=gap;g++){
      const wi=w0+(w1-w0)*g/gap; /* interpola dias sem pesagem */
      t=t+EWMA_ALPHA*(wi-t);

  }

function olsSlope(pairs){ /* regressão linear simples: [ [dias,y] ] → kg/dia */
  const n=pairs.length;
  const mx=pairs.reduce((s,p)=>s+p[0],0)/n, my=pairs.reduce((s,p)=>s+p[1],0)/n;
  let num=0,den=0;
  for(const[x,y]of pairs){num+=(x-mx)*(y-my);den+=(x-mx)*(x-mx)}
  return den?num/den:0;
}
function curWeight(){
  const tr=computeTrend(), wd=Object.keys(tr).sort();

/* ritmo-alvo em % do peso por semana, guardado por objetivo (déficit e superávit têm faixas diferentes);
   migra o antigo "rate" em kg/sem; teto por objetivo */
function ratePct(){
  const s=diet.settings;
  if(!s.ratePcts){
    const legacy=s.ratePct!=null?+s.ratePct:(s.rate!=null?s.rate/curWeight()*100:null);
    s.ratePcts={deficit:0.47,surplus:0.3};
    if(legacy!=null&&(s.mode==='deficit'||s.mode==='surplus'))s.ratePcts[s.mode]=Math.round(legacy*100)/100;
  }
  const v=s.ratePcts[s.mode]??(s.mode==='surplus'?0.3:0.47);
  return Math.min(RATE_MAX[s.mode]||1,Math.max(0.1,+v));
